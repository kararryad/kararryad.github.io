<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - 6.72</title>
    <!-- أكواد الكاتش القسري لـ PS4 -->
    <meta http-equiv="Cache-Control" content="max-age=31536000, public, immutable">
    <meta http-equiv="Pragma" content="cache">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000 url('https://kararryad.github.io/files/bg.jpg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            padding: 0;
            margin: 0;
        }
        .content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            padding: 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            width: 100%;
            padding-bottom: 15px;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(0, 255, 255, 0.3);
        }
        .top-bar .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            color: #00ffff;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
        .top-bar .version {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #ff00ff;
            text-shadow: 0 0 30px rgba(255,0,255,0.5);
        }
        .status-area {
            font-size: 2.2rem;
            font-weight: bold;
            color: #00ffff;
            margin: 30px 0;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            min-height: 80px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }
        .lock-area { margin: 40px 0; }
        .lock-icon {
            display: inline-block;
            font-size: 8rem;
            cursor: pointer;
            transition: 0.3s;
            padding: 30px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            border: 4px solid rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.2);
        }
        .lock-icon:hover { transform: scale(1.1) rotate(15deg); border-color: #00ffff; }
        .lock-icon.locked { color: #ff4444; border-color: #ff4444; }
        .lock-icon.unlocked { color: #00ffff; border-color: #00ffff; box-shadow: 0 0 80px rgba(0, 255, 255, 0.6); }
        .lock-icon.error { color: #ff0000; border-color: #ff0000; box-shadow: 0 0 80px rgba(255, 0, 0, 0.6); }
        .loader-container {
            display: none;
            width: 90%;
            max-width: 800px;
            height: 10px;
            background: rgba(0, 255, 255, 0.15);
            border-radius: 10px;
            margin: 30px auto 0;
            overflow: hidden;
            border: 2px solid rgba(0, 255, 255, 0.2);
        }
        .loader-container .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% 100%;
            animation: shimmer 1s linear infinite;
            border-radius: 10px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            transition: width 0.3s;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .footer { margin-top: 50px; color: #555; font-size: 0.9rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; width: 100%; }
    </style>
</head>
<body>
    <div class="content">
        <div class="top-bar">
            <div class="title">⚡ قاعه رياض</div>
            <div class="version">6.72 FW</div>
        </div>
        <div class="status-area" id="statusText">🔴 SYSTEM READY</div>
        
        <div class="lock-area">
            <div class="lock-icon locked" id="lockBtn" onclick="startInjection()">🔒</div>
            <div class="loader-container" id="loader"><div class="fill" id="progressFill"></div></div>
        </div>
        
        <div class="footer">&copy; 2026 قاعه رياض · بغداد</div>
    </div>

    <script>
        let isInjecting = false;

        function startInjection() {
            if (isInjecting) return;
            isInjecting = true;

            const lock = document.getElementById('lockBtn');
            const loader = document.getElementById('loader');
            const fill = document.getElementById('progressFill');
            const status = document.getElementById('statusText');

            lock.style.pointerEvents = 'none';
            loader.style.display = 'block';
            status.innerText = "⏳ INITIALIZING...";

            let counter = 4;
            const countInterval = setInterval(() => {
                status.innerText = `⏳ ${counter}`;
                counter--;
                if (counter < 0) {
                    clearInterval(countInterval);
                    status.innerText = "🚀 INJECTING...";
                    
                    let progress = 0;
                    const loadInterval = setInterval(() => {
                        progress += 10;
                        fill.style.width = progress + '%';
                        if (progress >= 100) {
                            clearInterval(loadInterval);
                            performRealInjection(lock, status, loader);
                        }
                    }, 150);
                }
            }, 1000);
        }

        function performRealInjection(lock, status, loader) {
            // الرابط المطلق للملف لضمان العثور عليه
            const payloadUrl = 'https://kararryad.github.io/files/672.bin';
            
            fetch(payloadUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Payload not found');
                    return response.arrayBuffer();
                })
                .then(data => {
                    // تم العثور على الملف
                    status.innerText = "⏳ WAITING FOR PS4 RESPONSE...";
                    
                    // محاكاة مراقبة الاستجابة
                    setTimeout(() => {
                        // إذا لم يستجب PS4، نفترض أن الحقن فشل
                        lock.classList.remove('locked');
                        lock.classList.add('error');
                        lock.innerText = '❌';
                        lock.style.pointerEvents = 'none';
                        loader.style.display = 'none';
                        status.innerText = "❌ HEN INJECTION FAILED! CHECK YOUR SYSTEM!";
                        isInjecting = false;
                    }, 5000); // 5 ثوانٍ مراقبة
                })
                .catch(error => {
                    // فشل في العثور على الملف
                    lock.classList.remove('locked');
                    lock.classList.add('error');
                    lock.innerText = '❌';
                    lock.style.pointerEvents = 'none';
                    loader.style.display = 'none';
                    status.innerText = "❌ PAYLOAD NOT FOUND! CHECK YOUR FILES!";
                    isInjecting = false;
                });
        }
    </script>
</body>
</html>
