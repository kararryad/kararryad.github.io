<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - The Godfather</title>
    <meta http-equiv="Cache-Control" content="max-age=31536000, public, immutable">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            /* صورة فيلم The Godfather الحقيقية */
            background: #000 url('https://image.tmdb.org/t/p/original/3bhkrj58Vtu7enYsRolD1fZdja1.jpg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
        }
        /* طبقة داكنة خفيفة جداً لجعل النص واضحاً */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }
        /* تمت إزالة الـ Container الحاجز */
        .content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 700px;
            text-align: center;
            padding: 20px;
        }
        .main-title {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            font-weight: 900;
            color: #d4af37;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .sub-title {
            color: #ddd;
            font-size: 1.1rem;
            letter-spacing: 3px;
            margin-bottom: 40px;
            font-family: 'Playfair Display', serif;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 25px;
        }
        /* الأزرار الواقعية 3D */
        .btn-real {
            display: block;
            text-decoration: none;
            padding: 25px 10px;
            border-radius: 16px;
            background: linear-gradient(180deg, #222, #111);
            border: 2px solid #d4af37;
            color: #d4af37;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            font-family: 'Tajawal', sans-serif;
            box-shadow: 
                0 8px 0 #0a0a0a,
                0 10px 20px rgba(0, 0, 0, 0.8);
            position: relative;
        }
        .btn-real:active {
            transform: translateY(6px);
            box-shadow: 
                0 2px 0 #0a0a0a,
                0 5px 15px rgba(0, 0, 0, 0.8);
        }
        .btn-real:hover {
            background: linear-gradient(180deg, #333, #1a1a1a);
            border-color: #ffd700;
            transform: translateY(-3px);
            box-shadow: 
                0 11px 0 #0a0a0a,
                0 15px 30px rgba(0, 0, 0, 0.8);
            color: #fff;
        }
        .btn-real .icon { display: block; font-size: 2.5rem; margin-bottom: 10px; }
        .btn-real .small { font-size: 0.8rem; color: #aaa; display: block; font-weight: normal; }

        .footer {
            margin-top: 50px;
            color: #aaa;
            font-size: 0.9rem;
            font-family: 'Playfair Display', serif;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="content">
        <div class="main-title">قاعه رياض</div>
        <div class="sub-title">بغداد · قطاع 57</div>

        <div class="grid">
            <a href="https://kararryad.github.io/hosts/672.html" class="btn-real">
                <span class="icon">💀</span>
                6.72 <span class="small">GoldHEN Classic</span>
            </a>
            <a href="https://kararryad.github.io/hosts/900.html" class="btn-real">
                <span class="icon">🔰</span>
                9.00 <span class="small">GoldHEN v2.4</span>
            </a>
            <a href="https://kararryad.github.io/hosts/1100.html" class="btn-real">
                <span class="icon">🌐</span>
                11.00 <span class="small">Webkit Only</span>
            </a>
            <a href="https://kararryad.github.io/files/cheats.zip" class="btn-real">
                <span class="icon">📦</span>
                الشفرات <span class="small">Cheats Pack</span>
            </a>
        </div>

        <div class="footer">قاعه رياض · مقدمة من بغداد</div>
    </div>
</body>
</html>
