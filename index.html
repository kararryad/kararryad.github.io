    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #050505;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(50, 0, 255, 0.15) 0%, transparent 40%),

            color: #f0f0f0;
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;

            padding: 20px;

        }

        .container {
            width: 100%;
            max-width: 550px;
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px;
            padding: 35px 25px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            text-align: center;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #ff0080, #ff8c00, #40e0d0, #ff0080);
            background-size: 400% 400%;
            border-radius: 37px;
            z-index: -1;
            animation: gradientShift 6s ease-in-out infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container.running {
            max-width: 800px;
            background: rgba(5, 5, 5, 0.9);
            border-color: rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.1);
        }
        .container.running::before {
            background: linear-gradient(45deg, #00ffff, #0066ff, #00ffff);
        }

        /* --- قسم الشعار الدائري --- */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out;
        }
        
        .logo-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(100, 0, 255, 0.3), inset 0 0 30px rgba(100, 0, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin: 0 auto 15px auto;

        .logo-circle::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 50%;

            animation: spinBorder 4s linear infinite;
        }
        @keyframes spinBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .logo-circle:hover {
            transform: scale(1.05) rotate(5deg);
            box-shadow: 0 0 50px rgba(100, 0, 255, 0.5);
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;

            color: #00ff00;

        .container.running .console-box {
            border-color: rgba(0, 255, 255, 0.3);

        .console-box .line { margin-bottom: 8px; }

        .grid {

        .btn-select:hover { transform: scale(1.05); border-color: rgba(0, 255, 255, 0.5); color: #fff; background: rgba(0, 255, 255, 0.05); }
        .btn-select.active { background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(0, 100, 255, 0.1)); border: 1px solid #00ffff; color: #fff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.1); }

        .btn-inject {
            width: 100%;
            padding: 20px;
            border-radius: 20px;
            font-size: 1.4rem;
            font-weight: 900;
            cursor: pointer;
            border: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Tajawal', sans-serif;
            color: #fff;
            background: linear-gradient(135deg, #ff0080, #ff8c00);
            box-shadow: 0 10px 30px rgba(255, 0, 128, 0.3);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-inject::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
            opacity: 0;
        }
        .btn-inject:hover::after { opacity: 1; left: 100%; }
        .btn-inject:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 40px rgba(255, 0, 128, 0.5); }
        .btn-inject:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; transform: none; }
        .btn-inject:disabled::after { opacity: 0; }
        
        .btn-inject.pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 128, 0.6); }
            70% { box-shadow: 0 0 0 25px rgba(255, 0, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 128, 0); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

<body>

    <div class="container" id="mainContainer">
        <div class="header">
            <!-- اللوجو الدائري -->
            <div class="logo-circle">
                <img src="https://kararryad.github.io/files/assets/logo.png" 
                     alt="قاعه رياض" 
                     class="logo-img">
            </div>
                 
            <div class="sub-title">بغداد · قطاع 57</div>
        </div>

        <div class="console-box" id="console">
            <div class="line info">[SYSTEM] واجهة عالية الجودة.</div>
            <div class="line info">[SYSTEM] اختر النسخة للمتابعة.</div>
        </div>

        <div class="grid">
            <div class="btn-select" data-version="672" onclick="selectVersion('672', this)">💀 6.72</div>
            <div class="btn-select active" data-version="900" onclick="selectVersion('900', this)">🔰 9.00</div>
            <div class="btn-select" data-version="1100" onclick="selectVersion('1100', this)">🔰 11.00</div>
        </div>

        <button class="btn-inject" id="injectBtn" onclick="startInjection()">🚀 تشغيل الحقن</button>
        
        <div class="footer">
            <div class="location">📍 بغداد - قطاع 57</div>
            &copy; 2026 قاعه رياض
        </div>
    </div>

    <script>
        let selectedVersion = '900';
        let countdownInterval;

        function selectVersion(version, element) {
            selectedVersion = version;
            document.querySelectorAll('.btn-select').forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');
            addLog(`[SYSTEM] تم تحديد النسخة: ${version.toUpperCase()}`, 'info');
            const btn = document.getElementById('injectBtn');
            btn.disabled = false;
            btn.innerText = "🚀 تشغيل الحقن";
            btn.classList.remove('pulse');
            document.getElementById('mainContainer').classList.remove('running');
        }

        function addLog(msg, type = 'normal') {
            const consoleDiv = document.getElementById('console');
            const line = document.createElement('div');
            line.className = 'line';
            if (type === 'error') line.classList.add('error');
            else if (type === 'success') line.classList.add('success');
            else if (type === 'dark') line.classList.add('dark');
            else if (type === 'info') line.classList.add('info');
            line.innerText = msg;
            consoleDiv.appendChild(line);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function startInjection() {
            const container = document.getElementById('mainContainer');
            const btn = document.getElementById('injectBtn');
            
            container.classList.add('running');
            btn.disabled = true;
            btn.classList.add('pulse');
            btn.innerText = `⏳ جاري التحضير...`;
            addLog(`[SYSTEM] بدء بروتوكول الحقن...`, 'info');
            
            let counter = 4;
            addLog(`[COUNTDOWN] ${counter}`, 'dark');
            
            countdownInterval = setInterval(() => {
                counter--;
                if (counter > 0) {
                    addLog(`[COUNTDOWN] ${counter}`, 'dark');
                    btn.innerText = `⏳ ${counter}`;
                } else {
                    clearInterval(countdownInterval);
                    addLog(`[COUNTDOWN] 0. بدء الحقن!`, 'success');
                    btn.innerText = `⚡ جاري الحقن`;
                    btn.classList.remove('pulse');
                    performInjection();
                }
            }, 1000);
        }

        function performInjection() {
            const url = `https://kararryad.github.io/hosts/${selectedVersion}.html`;
            addLog(`[SYSTEM] جاري الاتصال بالملف...`, 'info');
            setTimeout(() => {
                addLog(`[SYSTEM] ✅ تم الحقن بنجاح!`, 'success');
                addLog(`[SYSTEM] توجيه إلى الملف...`, 'success');
                window.location.href = url;
            }, 2000);
        }
    </script>
</body>
