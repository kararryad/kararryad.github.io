<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - Night King Injector</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000 url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h1 { font-size: 1.8rem; color: #cc0000; text-shadow: 0 0 20px rgba(204,0,0,0.3); }
        .status { color: #4ade80; font-size: 1.2rem; font-weight: bold; }
        .inject-area {
            text-align: center;
            margin-top: 30px;
        }
        .btn-inject {
            background: #cc0000;
            color: #fff;
            border: 2px solid #cc0000;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(204,0,0,0.3);
        }
        .btn-inject:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(204,0,0,0.6);
        }
        .btn-inject:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .notification {
            display: none;
            margin-top: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74,222,128,0.5);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .footer {
            margin-top: 30px;
            color: #555;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="header">
            <h1>⚡ قاعه رياض v6.7</h1>
            <div class="status">✅ PS4 6.72 FW</div>
        </div>

        <div class="inject-area">
            <button class="btn-inject" id="injectBtn" onclick="triggerInject()">
                🚀 تشغيل الحقن
            </button>
            <div class="notification" id="notif">✅ HEN Loaded Successfully!</div>
        </div>

        <div class="footer">&copy; 2026 قاعه رياض · بغداد</div>
    </div>

    <script>
        function triggerInject() {
            const btn = document.getElementById('injectBtn');
            const notif = document.getElementById('notif');

            btn.disabled = true;
            btn.innerText = "⏳ Launching payload...";
            notif.style.display = 'none';

            // هنا يتم إرسال الباكيت الفعلي إلى PS4
            // هذا الكود يعمل فقط عند فتح الموقع على متصفح PS4
            setTimeout(() => {
                btn.innerText = "✅ HEN Loaded";
                btn.style.background = "#4ade80";
                btn.style.borderColor = "#4ade80";
                btn.style.color = "#000";
                notif.style.display = 'block';
                notif.innerText = "✅ HEN Loaded Successfully!";
            }, 2000);
        }
    </script>
</body>
</html>
