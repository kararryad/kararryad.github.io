<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dexter Morgan | قاعه رياض</title>
    <meta http-equiv="Cache-Control" content="max-age=31536000, public, immutable">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Tajawal:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            /* خلفية سينمائية داكنة */
            background: #000 url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
        }
        /* طبقة دموية فوق الخلفية */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            background: linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(139,0,0,0.2) 50%, rgba(0,0,0,0.9) 100%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 800px;
            text-align: center;
            padding: 20px;
        }

        /* الشعار الرئيسي */
        .header {
            border-bottom: 2px solid rgba(204, 0, 0, 0.5);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .dex-logo {
            font-family: 'Oswald', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #cc0000;
            text-shadow: 0 0 20px rgba(204, 0, 0, 0.6);
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .main-title {
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            margin-top: 5px;
            font-family: 'Tajawal', sans-serif;
        }
        .quote {
            color: #ff4444;
            font-size: 1.1rem;
            margin-top: 5px;
            font-style: italic;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
            font-family: 'Orbitron', sans-serif;
        }

        /* بطاقات الأزرار دموية */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .btn-rip {
            display: block;
            text-decoration: none;
            padding: 25px 10px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #cc0000;
            color: #cc0000;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            font-family: 'Tajawal', sans-serif;
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.1);
        }
        .btn-rip:hover {
            background: rgba(204, 0, 0, 0.2);
            border-color: #ff0000;
            transform: translateY(-8px);
            box-shadow: 0 0 40px rgba(204, 0, 0, 0.4);
            color: #fff;
        }
        .btn-rip .icon { display: block; font-size: 2.5rem; margin-bottom: 10px; }
        .btn-rip .small { font-size: 0.8rem; color: #aaa; display: block; }

        /* عبارة الخاتمة */
        .footer {
            margin-top: 40px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid rgba(204, 0, 0, 0.3);
            padding-top: 20px;
            font-family: 'Orbitron', sans-serif;
        }
        .footer span { color: #cc0000; font-weight: bold; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="header">
            <div class="dex-logo">DEXTER</div>
            <div class="main-title">⚡ قاعه رياض</div>
            <div class="quote">Tonight's the night...</div>
        </div>

        <div class="grid">
            <a href="https://kararryad.github.io/hosts/672.html" class="btn-rip">
                <span class="icon">💀</span>
                6.72 <span class="small">GoldHEN Classic</span>
            </a>
            <a href="https://kararryad.github.io/hosts/900.html" class="btn-rip">
                <span class="icon">🔰</span>
                9.00 <span class="small">GoldHEN v2.4</span>
            </a>
            <a href="https://kararryad.github.io/hosts/1100.html" class="btn-rip">
                <span class="icon">🌐</span>
                11.00 <span class="small">Webkit Only</span>
            </a>
            <a href="https://kararryad.github.io/files/cheats.zip" class="btn-rip">
                <span class="icon">📦</span>
                الشفرات <span class="small">Cheats Pack</span>
            </a>
        </div>

        <div class="footer">
            <span>قاعه رياض</span> · مقدمة من <span>بغداد</span>
        </div>
    </div>
</body>
</html>
