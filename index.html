<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - البوابة الرئيسية</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .logo {
            font-size: 3.5rem;
            font-weight: bold;
            color: #cc0000;
            text-shadow: 0 0 20px rgba(204, 0, 0, 0.6);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 1.5rem;
            color: #dddddd;
            margin-bottom: 10px;
        }
        .number-box {
            background-color: #222;
            padding: 12px 30px;
            border-radius: 30px;
            border: 1px solid #cc0000;
            font-weight: bold;
            color: #cc0000;
            font-size: 1.3rem;
            display: inline-block;
            margin: 15px 0 30px 0;
        }
        .btn {
            background-color: #1e1e1e;
            border: 1px solid #cc0000;
            padding: 15px 40px;
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: inline-block;
        }
        .btn:hover {
            background-color: #cc0000;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.4);
        }
        .footer {
            margin-top: 50px;
            color: #444;
            font-size: 0.9rem;
            border-top: 1px solid #222;
            padding-top: 20px;
            width: 80%;
        }
    </style>
</head>
<body>

    <div class="logo">قاعه رياض</div>
    <div class="subtitle">مرحباً بكم في بوابتي الخاصة</div>
    <div class="number-box">📞 07736663121</div>
    
    <br>
    <!-- زر الدخول للموقع المنسوخ والمعدل -->
    <a href="https://kararryad.github.io/nightkinghost.com/index.html" class="btn">🚀 الدخول إلى المحتوى</a>

    <div class="footer">
        &copy; 2026 قاعه رياض. جميع الحقوق محفوظة.
    </div>

</body>
</html>
