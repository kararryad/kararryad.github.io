<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a192f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cairo', sans-serif;
            padding: 20px;
        }

        .main-box {
            background: #020c1b;
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 800px;
            height: 85vh;
            box-shadow: 0 0 30px rgba(91, 192, 255, 0.2);
            border: 1px solid #5bc0ff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tool-iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* طبقة التغطية (نضع الاسم والرقم فوق صورة القطة) */
        .profile-overlay {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            background: rgba(10, 25, 47, 0.7);
            padding: 20px 40px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(91, 192, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
            pointer-events: none; /* نسمح للضغط بالمرور للأداة */
        }

        .profile-overlay h1 {
            font-size: 4rem;
            color: #5bc0ff;
            text-shadow: 0 0 20px #5bc0ff;
            margin: 5px 0;
            line-height: 1.1;
        }

        .profile-overlay p {
            font-size: 1.6rem;
            color: #8ab4f8;
            margin: 5px 0;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {
            .profile-overlay h1 { font-size: 2.5rem; }
            .main-box { height: 80vh; }
        }
    </style>
</head>
<body>
    <div class="main-box">
        <iframe class="tool-iframe" src="https://zecoxao.github.io/ntfonto/"></iframe>
        
        <!-- هذه الطبقة تضع اسمك فوق صورة القطة -->
        <div class="profile-overlay">
            <h1>قاعه رياض</h1>
            <p>07736663121</p>
        </div>
    </div>
</body>
</html>
