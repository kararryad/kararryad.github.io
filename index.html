<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - Night King</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000 url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h1 { font-size: 1.8rem; color: #cc0000; text-shadow: 0 0 20px rgba(204,0,0,0.3); }
        .status { color: #4ade80; font-size: 1.2rem; font-weight: bold; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }
        .card {
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            text-decoration: none;
            color: #ccc;
            transition: 0.3s;
        }
        .card:hover {
            border-color: #cc0000;
            background: rgba(204,0,0,0.1);
            transform: translateY(-3px);
            color: #fff;
        }
        .card .icon { font-size: 2rem; display: block; margin-bottom: 8px; }
        .card .label { font-size: 0.8rem; font-weight: bold; }
        .footer {
            margin-top: 30px;
            color: #555;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="header">
            <h1>⚡ قاعه رياض v6.7</h1>
            <div class="status">✅ ملفاتك جاهزة</div>
        </div>

        <div class="grid">
            <!-- ملفاتك الحقيقية مرتبطة هنا -->
            <a href="https://kararryad.github.io/files/672.bin" class="card">
                <span class="icon">💀</span>
                <span class="label">672.bin</span>
            </a>
            <a href="https://kararryad.github.io/files/900.bin" class="card">
                <span class="icon">🔰</span>
                <span class="label">900.bin</span>
            </a>
            <a href="https://kararryad.github.io/files/1100.bin" class="card">
                <span class="icon">🌐</span>
                <span class="label">1100.bin</span>
            </a>
            <a href="https://kararryad.github.io/hosts/672.html" class="card">
                <span class="icon">🛡️</span>
                <span class="label">حقن 6.72</span>
            </a>
            <a href="https://kararryad.github.io/hosts/900.html" class="card">
                <span class="icon">⚡</span>
                <span class="label">حقن 9.00</span>
            </a>
            <a href="https://kararryad.github.io/hosts/1100.html" class="card">
                <span class="icon">🌀</span>
                <span class="label">حقن 11.00</span>
            </a>
            <a href="https://kararryad.github.io/trainer/" class="card">
                <span class="icon">🎮</span>
                <span class="label">Trainer</span>
            </a>
            <a href="https://kararryad.github.io/restore/" class="card">
                <span class="icon">🔄</span>
                <span class="label">Restore</span>
            </a>
            <a href="https://kararryad.github.io/files/cheats.zip" class="card">
                <span class="icon">📦</span>
                <span class="label">Cheats</span>
            </a>
        </div>

        <div class="footer">&copy; 2026 قاعه رياض · بغداد</div>
    </div>
</body>
</html>
