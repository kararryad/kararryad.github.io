<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - السينما</title>
    <meta http-equiv="Cache-Control" content="max-age=31536000, public, immutable">
    <!-- استيراد الخطوط الكلاسيكية -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            /* خلفية سينمائية داكنة */
            background: #000000 url('https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/The_Godfather_Logo.svg/1200px-The_Godfather_Logo.svg.png') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
        }
        /* طبقة داكنة فوق الصورة لجعل النص واضحاً */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 700px;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        /* الاسم الكبير (بدون ألوان) */
        .main-title {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem; /* تم التكبير */
            font-weight: 900;
            color: #d4af37; /* لون ذهبي داكن */
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.1);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .sub-title {
            color: #888;
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
            font-family: 'Playfair Display', serif;
        }

        /* الأزرار بدون ألوان زاهية */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
        }
        .btn-3d {
            display: block;
            text-decoration: none;
            padding: 20px 10px;
            border-radius: 15px;
            background: #111111;
            border: 1px solid #333;
            color: #d4af37;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
            text-align: center;
            font-family: 'Tajawal', sans-serif;
            box-shadow: 0 5px 0 #000;
        }
        .btn-3d:hover {
            background: #1a1a1a;
            border-color: #d4af37;
            transform: translateY(-3px);
            color: #fff;
        }
        .btn-3d .icon { display: block; font-size: 2.2rem; margin-bottom: 8px; }
        .btn-3d .small { font-size: 0.8rem; color: #666; display: block; }

        /* زر الحقن (مع العد 4 ثوانٍ) */
        .inject-area {
            margin-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 25px;
        }
        .btn-inject {
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            border: 1px solid #d4af37;
            background: transparent;
            color: #d4af37;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Playfair Display', serif;
            letter-spacing: 2px;
            box-shadow: 0 5px 0 #000;
        }
        .btn-inject:hover { background: #d4af37; color: #000; transform: translateY(-3px); }
        .btn-inject:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #222;
            color: #666;
            transform: none;
        }
        #countdownDisplay {
            display: block;
            margin-top: 15px;
            font-size: 2rem;
            color: #d4af37;
            font-family: 'Playfair Display', serif;
        }

        .footer {
            margin-top: 30px;
            color: #444;
            font-size: 0.8rem;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            padding-top: 20px;
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="main-title">قاعه رياض</div>
        <div class="sub-title">بغداد · قطاع 57</div>

        <div class="grid">
            <a href="https://kararryad.github.io/hosts/672.html" class="btn-3d">
                <span class="icon">💀</span>
                6.72 <span class="small">GoldHEN</span>
            </a>
            <a href="https://kararryad.github.io/hosts/900.html" class="btn-3d">
                <span class="icon">🔰</span>
                9.00 <span class="small">GoldHEN</span>
            </a>
            <a href="https://kararryad.github.io/hosts/1100.html" class="btn-3d">
                <span class="icon">🌐</span>
                11.00 <span class="small">Webkit</span>
            </a>
            <a href="https://kararryad.github.io/files/cheats.zip" class="btn-3d">
                <span class="icon">📦</span>
                الشفرات <span class="small">Cheats</span>
            </a>
        </div>

        <div class="inject-area">
            <button class="btn-inject" id="injectBtn" onclick="startCountdown()">🚀 تشغيل الحقن (4 ثوانٍ)</button>
            <div id="countdownDisplay"></div>
        </div>

        <div class="footer">قاعه رياض · مقدمة من بغداد</div>
    </div>

    <script>
        function startCountdown() {
            const btn = document.getElementById('injectBtn');
            const display = document.getElementById('countdownDisplay');
            btn.disabled = true;
            
            let counter = 4;
            display.innerText = `⏳ ${counter}`;
            
            const interval = setInterval(() => {
                counter--;
                if (counter > 0) {
                    display.innerText = `⏳ ${counter}`;
                } else {
                    clearInterval(interval);
                    display.innerText = "✅ جاري الحقن...";
                    btn.innerText = "⚡ جاري التنفيذ";
                    
                    // هنا تضع الرابط الذي تريد التوجه إليه بعد العد
                    setTimeout(() => {
                        window.location.href = "https://kararryad.github.io/hosts/900.html";
                    }, 1000);
                }
            }, 1000);
        }
    </script>
</body>
</html>
