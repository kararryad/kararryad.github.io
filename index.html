<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kararryad | 3D PS4 11.02</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cairo', sans-serif;
            perspective: 1000px;
            padding: 20px;
        }
        .main-card {
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            max-width: 750px;
            width: 100%;
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 30px 40px rgba(0,0,0,0.8), 0 0 0 2px #FFD700 inset;
            position: relative;
            transform: rotateY(10deg);
            transition: transform 0.5s;
            text-align: center;
        }
        .main-card:hover { transform: rotateY(0deg) scale(1.01); }
        
        .profile-section { margin-bottom: 30px; }
        .profile-section img {
            width: 150px; height: 150px; border-radius: 50%;
            border: 4px solid #FFD700; box-shadow: 0 0 40px #FFD700;
            margin-bottom: 15px;
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .profile-section h1 {
            font-size: 4rem; color: #FFD700; text-shadow: 0 0 20px #FFD700, 0 4px 0 #b8860b;
            font-weight: 900; letter-spacing: 2px; margin: 10px 0;
        }
        .profile-section .phone {
            font-size: 1.5rem; color: #aaa; background: rgba(255,215,0,0.1);
            display: inline-block; padding: 8px 25px; border-radius: 30px;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .launch-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px; padding: 25px; margin-top: 20px;
        }
        .btn-tool {
            display: block; padding: 15px; background: #FFD700;
            color: #000; font-weight: 900; font-size: 1.4rem; text-decoration: none;
            border-radius: 60px; box-shadow: 0 0 20px #FFD700;
            transition: 0.3s; border: 2px solid #FFD700;
            margin: 10px 0;
            text-align: center;
        }
        .btn-tool:active { transform: scale(0.95); }
        .btn-tool:hover { box-shadow: 0 0 50px #FFD700; background: #ffe44d; }
        
        .sub-text {
            color: #888; font-size: 0.9rem; margin-top: 10px;
        }
        @media (max-width: 600px) {
            .profile-section h1 { font-size: 3rem; }
            .profile-section img { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="profile-section">
            <img src="https://i.postimg.cc/J0S31W8V/logo.png" alt="شعار">
            <h1>kararryad</h1>

        </div>

        <div class="launch-card">
            <a href="https://ps4-exploit-host.netlify.app/" class="btn-tool" target="_blank">🚀 تشغيل الأداة (حامل عام)</a>
            <a href="https://ps4jb.com/" class="btn-tool" target="_blank" style="box-shadow: 0 0 30px #00aaff; border-color: #00aaff; background: #00aaff; color: white;">💀 تشغيل الأداة (PS4 11.02)</a>
            <div class="sub-text">اختر الأداة المناسبة لنسخة جهازك</div>
        </div>
    </div>
</body>
