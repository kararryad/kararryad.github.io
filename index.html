<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kararryad | Dexter</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
        }

        /* صورة خلفية 4K من خادم مضمون */
        .bg-layer {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-image: url('https://images.unsplash.com/photo-1555685812-4b943f101f1f?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: brightness(0.5) saturate(0.8);
            z-index: -2;
            animation: cinematicZoom 15s ease-in-out infinite alternate;
        }

        @keyframes cinematicZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.1) translateY(-2%); }
        }

        /* طبقة داكنة */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .card {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            padding: 45px 35px;
            border-radius: 25px;
            width: 100%;
            max-width: 550px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 40px rgba(255, 215, 0, 0.2);
        }

        .hero-name {
            font-size: 4.8rem;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 30px #FFD700, 0 4px 0 #996515;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        .phone-number {
            font-size: 1.8rem;
            color: #fff;
            background: rgba(255, 215, 0, 0.1);
            padding: 8px 25px;
            border-radius: 40px;
            display: inline-block;
            margin-bottom: 35px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .launch-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: #FFD700;
            color: #000;
            font-size: 1.8rem;
            font-weight: 900;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 0 25px #FFD700;
            transition: 0.2s;
        }

        .launch-btn:active {
            transform: scale(0.95);
        }

        .transition-screen {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #FFD700;
        }

        .transition-screen h2 { font-size: 3rem; letter-spacing: 5px; margin-bottom: 15px; }
        .transition-screen .loader {
            width: 50px; height: 50px;
            border: 5px solid #222;
            border-top: 5px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .hero-name { font-size: 3.5rem; }
            .launch-btn { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    <div class="overlay"></div>

    <div class="card">
        <div class="hero-name">kararryad</div>
        <div class="phone-number">07736663121</div>
        <button class="launch-btn" onclick="activateLaunch()">▶ تشغيل النظام</button>
    </div>

    <div id="transition" class="transition-screen">
        <h2>EXECUTING</h2>
        <div class="loader"></div>
        <p style="color:#aaa; margin-top:10px;">جاري التحميل...</p>
    </div>

    <script>
        function activateLaunch() {
            document.getElementById('transition').style.display = 'flex';
            setTimeout(() => {
                window.open('https://w90008.github.io/6/', '_blank');
                document.getElementById('transition').style.display = 'none';
            }, 2500);
        }
    </script>
</body>
</html>
