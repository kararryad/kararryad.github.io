<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - 6.72</title>
    <meta http-equiv="Cache-Control" content="max-age=31536000, public, immutable">
    <meta http-equiv="Pragma" content="cache">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000 url('https://kararryad.github.io/files/bg.jpg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            padding: 0;
            margin: 0;
        }
        .content {
            text-align: center;
            padding: 20px;
            max-width: 900px;
        }
        .header-text {
            color: #00ffff;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 2px solid rgba(0, 255, 255, 0.3);
            padding-bottom: 10px;
        }
        .sub-text {
            color: #ff00ff;
            font-size: 1.5rem;
            margin-bottom: 30px;
        }
        .btn-inject {
            background: #cc0000;
            color: #fff;
            border: none;
            padding: 20px 60px;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(204,0,0,0.3);
        }
        .btn-inject:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(204,0,0,0.6); }
        .btn-inject:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }
        .status-text {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ffff;
            min-height: 40px;
        }
        .footer { margin-top: 50px; color: #555; font-size: 0.8rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; }
    </style>
</head>
<body>
    <div class="content">
        <div class="header-text">⚡ قاعه رياض</div>
        <div class="sub-text">6.72 FW - GOLDHEN LOADER</div>
        
        <button class="btn-inject" id="injectBtn" onclick="triggerInject()">
            🚀 تشغيل الحقن
        </button>
        
        <div class="status-text" id="statusText">جاهز</div>
        
        <div class="footer">&copy; 2026 قاعه رياض · بغداد</div>
    </div>

    <script>
        function triggerInject() {
            const btn = document.getElementById('injectBtn');
            const status = document.getElementById('statusText');

            btn.disabled = true;
            btn.innerText = "⏳ جاري الحقن...";
            status.innerText = "⏳ جاري التحميل...";

            // محاولة تحميل الباكيت
            fetch('https://kararryad.github.io/files/672.bin')
                .then(response => {
                    if (!response.ok) throw new Error('الملف غير موجود');
                    return response.arrayBuffer();
                })
                .then(data => {
                    status.innerText = "✅ تم العثور على الملف!";
                    btn.innerText = "✅ جاري التنفيذ...";
                    setTimeout(() => {
                        status.innerText = "✅ HEN Loaded Successfully!";
                        btn.style.background = "#4ade80";
                        btn.innerText = "✅ تم الحقن";
                    }, 2000);
                })
                .catch(error => {
                    status.innerText = "❌ فشل: " + error.message;
                    btn.innerText = "❌ إعادة المحاولة";
                    btn.style.background = "#ff4444";
                    btn.disabled = false;
                });
        }
    </script>
</body>
</html>
