<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - The Godfather</title>
    <meta http-equiv="Cache-Control" content="max-age=31536000, public, immutable">
    <!-- استيراد خط كلاسيكي -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            background: radial-gradient(circle at 30% 30%, #1a1a1a 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 750px;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.4); /* لون الذهب الكلاسيكي */
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 30px 80px rgba(212, 175, 55, 0.05), inset 0 0 60px rgba(212, 175, 55, 0.02);
            text-align: center;
            position: relative;
        }
        /* العنوان الرئيسي (أسلوب العراب) */
        .godfather-title {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: #d4af37; /* الذهب */
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.2), 0 4px 8px rgba(0,0,0,0.8);
            letter-spacing: 2px;
            margin-bottom: 5px;
            position: relative;
        }
        .godfather-title::after {
            content: '';
            display: block;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 10px auto 0;
        }
        .sub-title {
            color: #888;
            font-size: 0.9rem;
            letter-spacing: 3px;
            margin-bottom: 30px;
            font-family: 'Playfair Display', serif;
        }

        /* نظام الأزرار ثلاثية الأبعاد */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 25px;
        }
        .btn-3d {
            display: block;
            text-decoration: none;
            padding: 25px 15px;
            border-radius: 20px;
            background: linear-gradient(180deg, #1a1a1a, #0a0a0a);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #d4af37;
            font-weight: bold;
            font-size: 1.2rem;
            position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 0 #000, 0 15px 30px rgba(0,0,0,0.5);
            text-align: center;
            font-family: 'Tajawal', sans-serif;
        }
        /* تأثير الارتفاع عند التمرير */
        .btn-3d:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 0 #000, 0 20px 40px rgba(0,0,0,0.6);
            border-color: #d4af37;
            background: linear-gradient(180deg, #2a1a0a, #1a1a1a);
            color: #fff;
        }
        .btn-3d .icon {
            display: block;
            font-size: 2.5rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
        }
        .btn-3d .small {
            font-size: 0.8rem;
            color: #666;
            display: block;
            margin-top: 5px;
        }
        .btn-3d:hover .small { color: #aaa; }

        .footer {
            margin-top: 40px;
            color: #444;
            font-size: 0.8rem;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            padding-top: 20px;
            font-family: 'Playfair Display', serif;
            letter-spacing: 1px;
        }
        .footer strong { color: #d4af37; }
    </style>
</head>
<body>
    <div class="container">
        <div class="godfather-title">قاعه رياض</div>
        <div class="sub-title">The Godfather · بغداد قطاع 57</div>

        <div class="grid">
            <a href="https://kararryad.github.io/hosts/672.html" class="btn-3d">
                <span class="icon">💀</span>
                6.72 <span class="small">GoldHEN كلاسيكي</span>
            </a>
            <a href="https://kararryad.github.io/hosts/900.html" class="btn-3d">
                <span class="icon">🔰</span>
                9.00 <span class="small">GoldHEN v2.4</span>
            </a>
            <a href="https://kararryad.github.io/hosts/1100.html" class="btn-3d">
                <span class="icon">🌐</span>
                11.00 <span class="small">Webkit Only</span>
            </a>
            <a href="https://kararryad.github.io/files/cheats.zip" class="btn-3d">
                <span class="icon">📦</span>
                الشفرات <span class="small">حزمة Cheats</span>
            </a>
        </div>

        <div class="footer">
            <strong>قاعه رياض</strong> · مقدمة من <strong>بغداد</strong>
        </div>
    </div>
</body>
</html>
