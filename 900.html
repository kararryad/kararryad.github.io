<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - 9.00</title>
    <!-- أكواد الكاتش الخاصة بـ PS4 -->
    <meta http-equiv="Cache-Control" content="max-age=31536000, public, immutable">
    <meta http-equiv="Pragma" content="cache">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000 url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .top-bar .title { font-size: 1.5rem; font-weight: bold; color: #ccc; }
        .top-bar .version { font-size: 1.3rem; color: #4ade80; font-weight: bold; }
        .status-area { font-size: 1.6rem; font-weight: bold; color: #4ade80; margin: 20px 0; text-shadow: 0 0 20px rgba(74,222,128,0.3); }
        
        .lock-area { margin: 20px 0; }
        .lock-icon {
            display: inline-block;
            font-size: 4rem;
            cursor: pointer;
            transition: 0.3s;
            padding: 20px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.1);
        }
        .lock-icon:hover { transform: scale(1.1); background: rgba(255,255,255,0.2); }
        .lock-icon.locked { color: #ff4444; border-color: #ff4444; }
        .lock-icon.unlocked { color: #4ade80; border-color: #4ade80; box-shadow: 0 0 30px rgba(74,222,128,0.3); }
        
        .loader-container {
            display: none;
            width: 80%;
            max-width: 400px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin: 15px auto 0;
            overflow: hidden;
        }
        .loader-container .fill {
            height: 100%;
            width: 0%;
            background: #4ade80;
            border-radius: 10px;
            transition: width 0.3s;
        }
        .footer { margin-top: 40px; color: #555; font-size: 0.8rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="top-bar">
            <div class="title">⚡ قاعه رياض</div>
            <div class="version">9.00 FW</div>
        </div>
        <div class="status-area" id="statusText">GoldHEN Loaded for 9.00 FW</div>
        
        <div class="lock-area">
            <div class="lock-icon locked" id="lockBtn" onclick="triggerInject()">🔒</div>
            <div class="loader-container" id="loader"><div class="fill" id="progressFill"></div></div>
        </div>
        
        <div class="footer">&copy; 2026 قاعه رياض · بغداد</div>
    </div>

    <script>
        function triggerInject() {
            const lock = document.getElementById('lockBtn');
            const loader = document.getElementById('loader');
            const fill = document.getElementById('progressFill');
            const status = document.getElementById('statusText');

            if (lock.classList.contains('unlocked')) return;

            lock.style.pointerEvents = 'none';
            loader.style.display = 'block';
            status.innerText = "⏳ Launching payload...";

            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                fill.style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        lock.classList.remove('locked');
                        lock.classList.add('unlocked');
                        lock.innerText = '🔓';
                        lock.style.pointerEvents = 'none';
                        loader.style.display = 'none';
                        status.innerText = "✅ GoldHEN Loaded Successfully!";
                    }, 500);
                }
            }, 200);
        }
    </script>
</body>
</html>
