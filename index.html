<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - Dexter Protocol</title>
    <style>
        /* إعدادات أساسية */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #080808;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* الحاوية الرئيسية مع الصورة */
        .container {
            width: 100%;
            max-width: 800px;
            position: relative;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(139, 0, 0, 0.4);
            /* إضافة صورة ديكستر من الإنترنت */
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Dexter_Morgan_%28Michael_C._Hall%29.jpg/640px-Dexter_Morgan_%28Michael_C._Hall%29.jpg');
            background-size: cover;
            background-position: center 30%;
            background-color: #111; /* لون احتياطي */
            padding: 40px 30px;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* طبقة سوداء فوق الصورة لجعل النص مقروءاً */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 40%, rgba(139,0,0,0.6) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* جميع المحتويات فوق الطبقة */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        /* أنميشن دخول النص */
        .title-main {
            font-size: 2.5rem;
            font-weight: 900;
            color: #cc0000;
            text-shadow: 0 0 30px rgba(204, 0, 0, 0.5);
            letter-spacing: 3px;
            margin-bottom: 5px;
            animation: fadeInDown 1s ease-out;
        }
        .sub-title {
            color: #aaa;
            font-size: 1rem;
            letter-spacing: 5px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        /* صندوق الأوامر */
        .console-box {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(204, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            min-height: 120px;
            margin-bottom: 25px;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            direction: ltr;
            color: #00ff00;
            backdrop-filter: blur(5px);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            overflow-y: auto;
            animation: fadeIn 1.2s ease-out 0.4s both;
        }
        .console-box .line { margin-bottom: 8px; }
        .console-box .line.error { color: #ff4444; }
        .console-box .line.success { color: #44ff44; }
        .console-box .line.dark { color: #ffaa00; font-weight: bold; text-shadow: 0 0 10px rgba(255,170,0,0.3); }

        /* أزرار النسخ */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }
        .btn-version {
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid #333;
            padding: 15px 5px;
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.3s;
            cursor: pointer;
            display: block;
            text-align: center;
            backdrop-filter: blur(2px);
            animation: fadeInUp 1s ease-out 0.6s both;
        }
        .btn-version:nth-child(2) { animation-delay: 0.7s; }
        .btn-version:nth-child(3) { animation-delay: 0.8s; }
        .btn-version:hover { border-color: #cc0000; transform: translateY(-3px); box-shadow: 0 5px 20px rgba(204,0,0,0.3); }
        .btn-version.active {
            background: rgba(139, 0, 0, 0.7);
            border-color: #cc0000;
            color: #fff;
            box-shadow: 0 0 20px rgba(204,0,0,0.4);
        }

        /* زر الحقن */
        .btn-inject {
            width: 100%;
            background: linear-gradient(180deg, #cc0000, #8b0000);
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 30px rgba(204,0,0,0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: fadeInUp 1s ease-out 0.9s both;
            position: relative;
            overflow: hidden;
        }
        .btn-inject:hover {
            transform: scale(1.02);
            box-shadow: 0 0 50px rgba(204,0,0,0.6);
        }
        .btn-inject:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        /* أنميشن نبض للزر عند التفعيل */
        .btn-inject.pulse {
            animation: pulse 1.5s infinite;
        }

        /* أنميشن النبض */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(204, 0, 0, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(204, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(204, 0, 0, 0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .footer {
            margin-top: 20px;
            color: #666;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
            animation: fadeIn 1.5s ease-out 1s both;
        }
        .footer .quote {
            color: #888;
            font-style: italic;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        @media (max-width: 600px) {
            .title-main { font-size: 1.8rem; }
            .container { padding: 20px 15px; min-height: 500px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="content">
            <!-- الرأس -->
            <div class="title-main">⚡ قاعه رياض</div>
            <div class="sub-title">Dexter Morgan // 4 Seconds Protocol</div>

            <!-- صندوق الأوامر -->
            <div class="console-box" id="console">
                <div class="line">[SYSTEM] Tonight's the night.</div>
                <div class="line">[SYSTEM] Target acquired. Select version.</div>
            </div>

            <!-- أزرار النسخ -->
            <div class="grid">
                <div class="btn-version" onclick="selectVersion('672', this)">💀 6.72</div>
                <div class="btn-version active" onclick="selectVersion('900', this)">🔰 9.00</div>
                <div class="btn-version" onclick="selectVersion('1100', this)">🔰 11.00</div>
            </div>

            <!-- زر الحقن -->
            <button class="btn-inject" id="injectBtn" onclick="startCountdown()">🚀 INJECT (4s)</button>
            
            <!-- التذييل -->
            <div class="footer">
                <div class="quote">"Dark Passenger is watching..."</div>
                &copy; 2026 قاعه رياض
            </div>
        </div>
    </div>

    <script>
        let selectedVersion = '900';
        let countdownInterval;

        function selectVersion(version, element) {
            selectedVersion = version;
            document.querySelectorAll('.btn-version').forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');
            addLog(`[SYSTEM] Target locked: ${version.toUpperCase()}`);
            document.getElementById('injectBtn').disabled = false;
            document.getElementById('injectBtn').innerText = "🚀 INJECT (4s)";
            document.getElementById('injectBtn').classList.remove('pulse');
        }

        function addLog(msg, type = 'normal') {
            const consoleDiv = document.getElementById('console');
            const line = document.createElement('div');
            line.className = 'line';
            if (type === 'error') line.classList.add('error');
            else if (type === 'success') line.classList.add('success');
            else if (type === 'dark') line.classList.add('dark');
            line.innerText = msg;
            consoleDiv.appendChild(line);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function startCountdown() {
            const btn = document.getElementById('injectBtn');
            btn.disabled = true;
            btn.classList.add('pulse');
            btn.innerText = `⏳ EXECUTING (4)`;
            addLog(`[COUNTDOWN] 4 seconds...`, 'dark');
            let counter = 4;
            countdownInterval = setInterval(() => {
                counter--;
                if (counter > 0) {
                    addLog(`[COUNTDOWN] ${counter}...`, 'dark');
                    btn.innerText = `⏳ EXECUTING (${counter})`;
                } else {
                    clearInterval(countdownInterval);
                    addLog(`[COUNTDOWN] 0. // INJECT NOW.`, 'success');
                    btn.innerText = `⚡ INJECTING...`;
                    btn.classList.remove('pulse');
                    performInjection();
                }
            }, 1000);
        }

        function performInjection() {
            const url = `https://kararryad.github.io/hosts/${selectedVersion}.html`;
            addLog(`[SYSTEM] Connecting to payload: ${selectedVersion.toUpperCase()}`);
            setTimeout(() => {
                addLog(`[SYSTEM] ✅ PAYLOAD LOADED.`, 'success');
                addLog(`[SYSTEM] Redirecting...`, 'success');
                window.location.href = url;
            }, 2000);
        }
    </script>
</body>
</html>
