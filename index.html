<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض | بغداد - قطاع 57</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0d0d0d;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(0, 150, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(255, 0, 100, 0.05) 0%, transparent 40%);
            color: #e0e0e0;
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* تأثير الحافة المتدرجة الساحرة */
        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5, #ff0055, #00d2ff);
            background-size: 400% 400%;
            border-radius: 32px;
            z-index: -1;
            animation: gradientShift 8s ease-in-out infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* الرأس */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            animation: fadeIn 1s ease-out;
        }
        .logo-icon {
            font-size: 3rem;
            margin-bottom: 5px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .site-title {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            letter-spacing: 1px;
        }
        .sub-title {
            color: #888;
            font-size: 1.1rem;
            margin-top: 5px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            width: 100%;
        }
        .sub-title span { color: #00d2ff; font-weight: bold; }

        /* صندوق الأوامر */
        .console-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            min-height: 110px;
            margin-bottom: 25px;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            direction: ltr;
            color: #00ff00;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
            overflow-y: auto;
            animation: fadeIn 1.2s ease-out 0.2s both;
        }
        .console-box .line { margin-bottom: 8px; }
        .console-box .line.error { color: #ff4444; }
        .console-box .line.success { color: #44ff44; }
        .console-box .line.dark { color: #ffaa00; font-weight: bold; }
        .console-box .line.info { color: #00d2ff; }

        /* أزرار الاختيار */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            animation: fadeIn 1.2s ease-out 0.4s both;
        }
        .btn-select {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px 5px;
            border-radius: 12px;
            text-decoration: none;
            color: #aaa;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            display: block;
            text-align: center;
            font-family: 'Tajawal', sans-serif;
        }
        .btn-select:hover {
            transform: scale(1.05);
            border-color: rgba(0, 210, 255, 0.5);
            color: #fff;
            background: rgba(0, 210, 255, 0.05);
        }
        .btn-select.active {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.15), rgba(58, 123, 213, 0.15));
            border-image: linear-gradient(135deg, #00d2ff, #3a7bd5) 1;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.1);
        }
        /* تلوين الأزرار حسب النسخة */
        .btn-select[data-version="672"]:hover, .btn-select[data-version="672"].active {
            border-color: #ff0055;
            background: rgba(255, 0, 85, 0.1);
        }
        .btn-select[data-version="900"]:hover, .btn-select[data-version="900"].active {
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.1);
        }
        .btn-select[data-version="1100"]:hover, .btn-select[data-version="1100"].active {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        /* زر الحقن الرئيسي */
        .btn-inject {
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            font-size: 1.4rem;
            font-weight: 900;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            font-family: 'Tajawal', sans-serif;
            color: #fff;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            box-shadow: 0 5px 30px rgba(0, 210, 255, 0.2);
            position: relative;
            overflow: hidden;
            animation: fadeIn 1.2s ease-out 0.6s both;
        }
        .btn-inject::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
            opacity: 0;
        }
        .btn-inject:hover::after { opacity: 1; left: 100%; }
        .btn-inject:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 40px rgba(0, 210, 255, 0.4);
        }
        .btn-inject:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .btn-inject:disabled::after { opacity: 0; }

        /* أنميشن نبض عند التفعيل */
        .btn-inject.pulse {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0.5); }
            70% { box-shadow: 0 0 0 20px rgba(0, 210, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تذييل الصفحة */
        .footer {
            margin-top: 25px;
            color: #555;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
            animation: fadeIn 1s ease-out 0.8s both;
        }
        .footer .location {
            color: #00d2ff;
            font-weight: bold;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-icon">🏛️</div>
            <div class="site-title">قاعه رياض</div>
            <div class="sub-title">بغداد · <span>قطاع 57</span> · منصة الحقن</div>
        </div>

        <div class="console-box" id="console">
            <div class="line info">[SYSTEM] النظام جاهز.</div>
            <div class="line info">[SYSTEM] اختر النسخة واضغط الحقن.</div>
        </div>

        <div class="grid">
            <div class="btn-select" data-version="672" onclick="selectVersion('672', this)">💀 6.72</div>
            <div class="btn-select active" data-version="900" onclick="selectVersion('900', this)">🔰 9.00</div>
            <div class="btn-select" data-version="1100" onclick="selectVersion('1100', this)">🔰 11.00</div>
        </div>

        <button class="btn-inject" id="injectBtn" onclick="startCountdown()">🚀 الحقن (4 ثوانٍ)</button>
        
        <div class="footer">
            <div class="location">📍 بغداد - قطاع 57</div>
            &copy; 2026 قاعه رياض
        </div>
    </div>

    <script>
        let selectedVersion = '900';
        let countdownInterval;

        function selectVersion(version, element) {
            selectedVersion = version;
            document.querySelectorAll('.btn-select').forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');
            addLog(`[SYSTEM] تم تحديد النسخة: ${version.toUpperCase()}`, 'info');
            const btn = document.getElementById('injectBtn');
            btn.disabled = false;
            btn.innerText = "🚀 الحقن (4 ثوانٍ)";
            btn.classList.remove('pulse');
        }

        function addLog(msg, type = 'normal') {
            const consoleDiv = document.getElementById('console');
            const line = document.createElement('div');
            line.className = 'line';
            if (type === 'error') line.classList.add('error');
            else if (type === 'success') line.classList.add('success');
            else if (type === 'dark') line.classList.add('dark');
            else if (type === 'info') line.classList.add('info');
            line.innerText = msg;
            consoleDiv.appendChild(line);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function startCountdown() {
            const btn = document.getElementById('injectBtn');
            btn.disabled = true;
            btn.classList.add('pulse');
            btn.innerText = `⏳ التنفيذ (4)`;
            addLog(`[COUNTDOWN] 4 ثوانٍ...`, 'dark');
            let counter = 4;
            countdownInterval = setInterval(() => {
                counter--;
                if (counter > 0) {
                    addLog(`[COUNTDOWN] ${counter}...`, 'dark');
                    btn.innerText = `⏳ التنفيذ (${counter})`;
                } else {
                    clearInterval(countdownInterval);
                    addLog(`[COUNTDOWN] 0. بدء الحقن!`, 'success');
                    btn.innerText = `⚡ جاري الحقن...`;
                    btn.classList.remove('pulse');
                    performInjection();
                }
            }, 1000);
        }

        function performInjection() {
            const url = `https://kararryad.github.io/hosts/${selectedVersion}.html`;
            addLog(`[SYSTEM] جاري الاتصال بالملف: ${selectedVersion.toUpperCase()}`, 'info');
            setTimeout(() => {
                addLog(`[SYSTEM] ✅ تم تحميل الباكيت بنجاح!`, 'success');
                addLog(`[SYSTEM] يتم التوجيه الآن...`, 'success');
                window.location.href = url;
            }, 1500);
        }
    </script>
</body>
</html>
