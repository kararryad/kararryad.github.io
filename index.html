<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - Night King</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000 url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h1 { font-size: 1.8rem; color: #cc0000; text-shadow: 0 0 20px rgba(204,0,0,0.3); }
        .status { color: #4ade80; font-size: 1.2rem; font-weight: bold; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }
        .card {
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            text-decoration: none;
            color: #ccc;
            transition: 0.3s;
        }
        .card:hover {
            border-color: #cc0000;
            background: rgba(204,0,0,0.1);
            transform: translateY(-3px);
            color: #fff;
        }
        .card .icon { font-size: 2rem; display: block; margin-bottom: 8px; }
        .card .label { font-size: 0.8rem; font-weight: bold; }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #4ade80;
            color: #4ade80;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(74,222,128,0.3);
            display: none;
            z-index: 10;
        }
        .footer {
            margin-top: 30px;
            color: #555;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="header">
            <h1>⚡ قاعه رياض v6.7</h1>
            <div class="status">✅ انقر لتشغيل الجيلبريك</div>
        </div>

        <div class="grid">
            <!-- الأزرار ستقوم بتشغيل سكربت الحقن -->
            <a onclick="triggerInject('672')" class="card" style="cursor: pointer;">
                <span class="icon">💀</span>
                <span class="label">6.72 GoldHEN</span>
            </a>
            <a onclick="triggerInject('900')" class="card" style="cursor: pointer;">
                <span class="icon">🔰</span>
                <span class="label">9.00 GoldHEN</span>
            </a>
            <a onclick="triggerInject('1100')" class="card" style="cursor: pointer;">
                <span class="icon">🌐</span>
                <span class="label">11.00 Webkit</span>
            </a>
            <a onclick="triggerInject('trainer')" class="card" style="cursor: pointer;">
                <span class="icon">🎮</span>
                <span class="label">Offline Trainer</span>
            </a>
            <a onclick="triggerInject('restore')" class="card" style="cursor: pointer;">
                <span class="icon">🔄</span>
                <span class="label">Restore</span>
            </a>
        </div>

        <div class="footer">&copy; 2026 قاعه رياض · بغداد</div>
    </div>

    <!-- نافذة الإشعار -->
    <div class="notification" id="notification">✅ HEN Loaded Successfully!</div>

    <script>
        // دالة الحقن المباشر (بدون تحميل ولا فتح صفحات)
        function triggerInject(version) {
            const notif = document.getElementById('notification');
            // تغيير الرسالة حسب النسخة
            notif.innerHTML = `⏳ Loading ${version.toUpperCase()} payload...`;
            notif.style.display = 'block';
            notif.style.borderColor = '#ffaa00';
            notif.style.color = '#ffaa00';

            // محاكاة عملية الحقن (هنا يمكن وضع كود الحقن الحقيقي)
            setTimeout(() => {
                if (version === '672') {
                    notif.innerHTML = `✅ GoldHEN 2.4b18 Loaded for 6.72 FW`;
                } else if (version === '900') {
                    notif.innerHTML = `✅ GoldHEN 2.4b18 Loaded for 9.00 FW`;
                } else {
                    notif.innerHTML = `✅ ${version.toUpperCase()} Loaded Successfully!`;
                }
                notif.style.borderColor = '#4ade80';
                notif.style.color = '#4ade80';
                
                // اختفاء الإشعار بعد 5 ثوان
                setTimeout(() => {
                    notif.style.display = 'none';
                }, 5000);
            }, 2000);
        }
    </script>
</body>
</html>
