<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kararryad | Kali Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            padding: 20px;
        }

        .kali-box {
            background: #000;
            padding: 50px 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 2px solid #FFD700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
            position: relative;
        }

        /* شعار Kali Linux Style */
        .kali-logo {
            font-family: 'Share Tech Mono', monospace;
            font-size: 6rem;
            font-weight: bold;
            color: #FFD700;
            letter-spacing: -3px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            text-transform: uppercase;
            margin: 10px 0;
            transform: skewX(-10deg);
        }

        .sub-text {
            font-size: 1.2rem;
            color: #888;
            letter-spacing: 5px;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .phone-display {
            font-size: 1.6rem;
            color: #aaa;
            margin-bottom: 35px;
            letter-spacing: 2px;
        }

        .launch-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: transparent;
            color: #FFD700;
            font-size: 1.6rem;
            font-family: 'Share Tech Mono', monospace;
            border: 2px solid #FFD700;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .launch-btn:active {
            background: #FFD700;
            color: #000;
            transform: scale(0.95);
        }

        @media (max-width: 600px) {
            .kali-logo { font-size: 4rem; }
            .launch-btn { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="kali-box">
        <div class="kali-logo">kararryad</div>
        <div class="sub-text">// PS4 TOOL //</div>
        <div class="phone-display">07736663121</div>
        <button class="launch-btn" onclick="window.open('https://zecoxao.github.io/ntfonto/', '_blank')">[ تشغيل النظام ]</button>
    </div>
</body>
</html>
