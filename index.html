<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - العتمة السينمائية</title>
    <meta http-equiv="Cache-Control" content="max-age=31536000, public, immutable">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            /* خلفية داكنة متدرجة */
            background: radial-gradient(circle at 80% 20%, #1a0000 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        /* طبقة الدخان والنار */
        .smoke {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 10% 90%, rgba(139, 0, 0, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 90% 10%, rgba(255, 0, 0, 0.2) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 700px;
            text-align: center;
            padding: 40px 20px;
        }

        /* العنوان الرئيسي */
        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            color: #cc0000;
            text-shadow: 0 0 30px rgba(204, 0, 0, 0.7), 0 0 60px rgba(204, 0, 0, 0.3);
            letter-spacing: 5px;
            margin-bottom: 10px;
        }
        .sub-title {
            color: #aaa;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(204, 0, 0, 0.2);
            padding-bottom: 15px;
        }
        .location {
            color: #ff4444;
            font-size: 0.9rem;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        /* شبكة البطاقات الأنيقة */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        .btn-card {
            display: block;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(204, 0, 0, 0.6);
            border-radius: 20px;
            padding: 30px 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #fff;
            text-align: center;
            font-family: 'Tajawal', sans-serif;
            box-shadow: inset 0 0 20px rgba(204, 0, 0, 0.05);
        }
        .btn-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #ff0000;
            box-shadow: 0 0 40px rgba(204, 0, 0, 0.4), inset 0 0 30px rgba(204, 0, 0, 0.1);
            background: rgba(139, 0, 0, 0.4);
        }
        .btn-card .icon {
            display: block;
            font-size: 3rem;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 10px rgba(204, 0, 0, 0.4));
        }
        .btn-card .title {
            font-weight: bold;
            font-size: 1.4rem;
            display: block;
            margin-bottom: 5px;
        }
        .btn-card .desc {
            font-size: 0.8rem;
            color: #888;
            font-weight: 300;
        }
        .btn-card:hover .desc { color: #ddd; }

        .footer {
            margin-top: 50px;
            color: #444;
            font-size: 0.8rem;
            letter-spacing: 1px;
            border-top: 1px solid rgba(204, 0, 0, 0.1);
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="smoke"></div>
    <div class="content">
        <div class="main-title">⚡ قاعه رياض</div>
        <div class="sub-title">بغداد · المدينة · <span class="location">قطاع 57</span></div>

        <div class="grid">
            <a href="https://kararryad.github.io/hosts/672.html" class="btn-card">
                <span class="icon">💀</span>
                <span class="title">6.72</span>
                <span class="desc">GoldHEN Classic</span>
            </a>
            <a href="https://kararryad.github.io/hosts/900.html" class="btn-card">
                <span class="icon">🔰</span>
                <span class="title">9.00</span>
                <span class="desc">GoldHEN v2.4</span>
            </a>
            <a href="https://kararryad.github.io/hosts/1100.html" class="btn-card">
                <span class="icon">🌐</span>
                <span class="title">11.00</span>
                <span class="desc">Webkit Only</span>
            </a>
            <a href="https://kararryad.github.io/files/cheats.zip" class="btn-card">
                <span class="icon">📦</span>
                <span class="title">الشفرات</span>
                <span class="desc">Cheats Pack</span>
            </a>
        </div>

        <div class="footer">قاعه رياض · مقدمة من بغداد</div>
    </div>
</body>
</html>
