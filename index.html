<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - البوابة الرئيسية</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { text-align: center; max-width: 800px; width: 100%; }
        .main-title { font-size: 4rem; color: #cc0000; text-shadow: 0 0 30px rgba(204, 0, 0, 0.6); margin-bottom: 10px; }
        .sub-title { color: #aaa; margin-bottom: 20px; }
        .contact-box {
            background: #1a1a1a;
            border: 1px solid #cc0000;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            font-size: 1.2rem;
            font-weight: bold;
            color: #cc0000;
            margin-bottom: 30px;
        }
        .grid-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
        }
        .card {
            background: #181818;
            padding: 25px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            border: 1px solid #333;
            transition: 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            background: #cc0000;
            border-color: #cc0000;
        }
        .jailbreak-btn {
            background: #cc0000;
            color: #fff;
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
            transition: 0.3s;
        }
        .jailbreak-btn:hover { background: #ff1a1a; transform: scale(1.05); }
        .footer { margin-top: 40px; color: #444; border-top: 1px solid #222; padding-top: 20px; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="main-title">قاعه رياض</h1>
        <p class="sub-title">البوابة الرسمية للأدوات والخدمات</p>
        <div class="contact-box">📞 07736663121</div>

        <div class="grid-links">
            <a href="tel:07736663121" class="card"><h2>📞 اتصل بي</h2><p>الاتصال المباشر</p></a>
            <a href="https://wa.me/9647736663121" class="card" target="_blank"><h2>💬 واتساب</h2><p>راسلني فوراً</p></a>
            <a href="https://t.me/YourUsername" class="card" target="_blank"><h2>✈️ تيليجرام</h2><p>انضم للقناة</p></a>

        <!-- الزر السريع للجيلبريك (بدون مجلدات) -->

        <div class="footer">&copy; 2026 قاعه رياض. جميع الحقوق محفوظة.</div>
