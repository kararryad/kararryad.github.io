<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kararryad | Dexter</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        /* خلفية ديكستر مورغان مع تأثير حركة بطيء (Zoom) */
        .bg-layer {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-image: url('https://wallpapercave.com/wp/wp4158775.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.4) contrast(1.1);
            z-index: -2;
            animation: cinematicZoom 15s ease-in-out infinite alternate;
        }

        @keyframes cinematicZoom {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(-2%, -2%); }
        }

        /* طبقة داكنة شفافة فوق الصورة لتوضيح النص */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        .card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 50px 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 650px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            position: relative;
            z-index: 10;
            transform: scale(1);
            transition: transform 0.4s;
        }
        .card:hover { transform: scale(1.02); }

        .hero-name {
            font-size: 5rem;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 30px #FFD700, 0 4px 0 #996515;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        .phone-number {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            background: rgba(255, 215, 0, 0.15);
            padding: 10px 30px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .launch-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: #FFD700;
            color: #000;
            font-size: 2rem;
            font-weight: 900;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 0 30px #FFD700;
            font-family: 'Cairo', sans-serif;
            transition: 0.2s;
        }
        .launch-btn:active {
            transform: scale(0.95);
            background: #fff0a0;
        }

        /* شاشة التحميل السينمائية */
        .transition-screen {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #FFD700;
        }

        .transition-screen h2 {
            font-size: 3rem;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #FFD700;
            margin-bottom: 20px;
        }

        .transition-screen .loader {
            width: 60px; height: 60px;
            border: 6px solid #222;
            border-top: 6px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .hero-name { font-size: 3.5rem; }
            .launch-btn { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- صورة خلفية ديكستر متحركة -->
    <div class="bg-layer"></div>
    <div class="overlay"></div>

    <div class="card">
        <div class="hero-name">kararryad</div>
        <div class="phone-number">07736663121</div>
        <button class="launch-btn" onclick="activateLaunch()">▶ تشغيل النظام</button>
    </div>

    <div id="transition" class="transition-screen">
        <h2>EXECUTING</h2>
        <div class="loader"></div>
        <p style="color:#aaa; margin-top:15px;">جاري تجهيز البيئة...</p>
    </div>

    <script>
        function activateLaunch() {
            document.getElementById('transition').style.display = 'flex';
            setTimeout(() => {
                window.open('https://w90008.github.io/6/', '_blank');
                document.getElementById('transition').style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
