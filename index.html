<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - John Wick</title>
    <meta http-equiv="Cache-Control" content="max-age=31536000, public, immutable">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000 url('https://images.unsplash.com/photo-1504384308090-cf351d715110?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 800px;
            text-align: center;
            padding: 20px;
        }

        .header {
            margin-bottom: 30px;
        }
        .main-title {
            font-family: 'Oswald', sans-serif;
            font-size: 3.2rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
        }
        .sub-title {
            color: #aaa;
            font-size: 1.1rem;
            margin-top: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .btn-card {
            display: block;
            text-decoration: none;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px 10px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #ccc;
            text-align: center;
            font-family: 'Tajawal', sans-serif;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .btn-card:hover {
            transform: translateY(-5px);
            border-color: #ff0000;
            background: rgba(30, 0, 0, 0.9);
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.1);
        }
        .btn-card .icon {
            display: block;
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
        .btn-card .title {
            font-weight: bold;
            font-size: 1.3rem;
            display: block;
            margin-bottom: 5px;
        }
        .btn-card .desc {
            font-size: 0.8rem;
            color: #666;
        }

        .footer {
            margin-top: 40px;
            color: #555;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="content">
        <div class="header">
            <div class="main-title">⚡ قاعه رياض</div>
            <div class="sub-title">بغداد · المدينة · قطاع 57</div>
        </div>

        <div class="grid">
            <a href="https://kararryad.github.io/hosts/672.html" class="btn-card">
                <span class="icon">💀</span>
                <span class="title">6.72</span>
                <span class="desc">GoldHEN</span>
            </a>
            <a href="https://kararryad.github.io/hosts/900.html" class="btn-card">
                <span class="icon">🔰</span>
                <span class="title">9.00</span>
                <span class="desc">GoldHEN v2.4</span>
            </a>
            <a href="https://kararryad.github.io/hosts/1100.html" class="btn-card">
                <span class="icon">🌐</span>
                <span class="title">11.00</span>
                <span class="desc">Webkit</span>
            </a>
            <a href="https://kararryad.github.io/files/cheats.zip" class="btn-card">
                <span class="icon">📦</span>
                <span class="title">الشفرات</span>
                <span class="desc">Cheats</span>
            </a>
        </div>

        <div class="footer">قاعه رياض · مقدمة من بغداد</div>
    </div>
</body>
</html>
