<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a192f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cairo', sans-serif;
            padding: 20px;
        }

        .main-box {
            background: #020c1b;
            padding: 10px;
            border-radius: 20px;
            width: 100%;
            max-width: 850px;
            height: 85vh;
            box-shadow: 0 0 30px rgba(91, 192, 255, 0.2);
            border: 1px solid #5bc0ff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tool-iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* إخفاء صورة القطة تماماً */
        .tool-iframe {
            filter: drop-shadow(0 0 0 transparent);
        }

        /* وضع اسمك ورقمك في المكان الثابت (الزاوية اليسرى السفلى) */
        .profile-overlay {
            position: absolute;
            /* هذه الإحداثيات تضع الاسم في نفس مكان صورة القطة بدقة */
            bottom: 15%;
            left: 8%;
            z-index: 20;
            text-align: center;
            background: rgba(10, 25, 47, 0.85);
            padding: 15px 25px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(91, 192, 255, 0.4);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            pointer-events: none; /* يسمح بضغط الأزرار من خلال الاسم */
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(91, 192, 255, 0.2); }
            50% { box-shadow: 0 0 40px rgba(91, 192, 255, 0.6); }
        }

        .profile-overlay h1 {
            font-size: 2.8rem;
            color: #5bc0ff;
            text-shadow: 0 0 20px #5bc0ff;
            margin: 0;
            line-height: 1.1;
        }

        .profile-overlay p {
            font-size: 1.2rem;
            color: #8ab4f8;
            margin: 5px 0 0 0;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {
            .profile-overlay {
                bottom: 12%;
                left: 5%;
                padding: 10px 15px;
            }
            .profile-overlay h1 { font-size: 2rem; }
            .profile-overlay p { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="main-box">
        <iframe class="tool-iframe" src="https://zecoxao.github.io/ntfonto/"></iframe>
        
        <!-- اسمك ورقمك يظهران بدقة في مكان صورة القطة -->
        <div class="profile-overlay">
            <h1>قاعه رياض</h1>
            <p>07736663121</p>
        </div>
    </div>
</body>
</html>
