<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - لوحة تشريح Dexter</title>
    <style>
        /* إعدادات أساسية سينمائية */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        body {
            background: #080808;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(139, 0, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(0, 0, 0, 0.9) 0%, #000 100%);
            color: #c0c0c0;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* تخطيط الصفحة */
        .container {
            width: 100%;
            max-width: 750px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(180, 0, 0, 0.2);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 0 40px rgba(139, 0, 0, 0.1), inset 0 0 30px rgba(0, 0, 0, 0.5);
            position: relative;
            text-align: center;
        }

        /* تأثيرات Dexter المميزة */
        .header-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .header-line .line {
            flex-grow: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, #8b0000, transparent);
        }
        .title-main {
            font-size: 2.2rem;
            font-weight: 900;
            color: #cc0000;
            text-shadow: 0 0 20px rgba(204, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title-main .icon {
            font-size: 2rem;
            color: #fff;
            background: #cc0000;
            padding: 5px 12px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.5);
        }
        .sub-title {
            color: #666;
            font-size: 0.9rem;
            letter-spacing: 4px;
            margin-bottom: 30px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 10px;
        }

        /* صندوق الأوامر */
        .console-box {
            background: #050505;
            border: 1px solid #1a1a1a;
            border-radius: 10px;
            padding: 20px;
            min-height: 120px;
            margin-bottom: 25px;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            direction: ltr;
            color: #00ff00;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            overflow-y: auto;
        }
        .console-box .line { margin-bottom: 6px; }
        .console-box .line.error { color: #ff4444; }
        .console-box .line.success { color: #44ff44; }
        .console-box .line.dark { color: #ffaa00; font-weight: bold; text-shadow: 0 0 10px rgba(255,170,0,0.3); }

        /* أزرار النسخ */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }
        .btn-version {
            background: #111;
            border: 1px solid #222;
            padding: 15px 5px;
            border-radius: 8px;
            text-decoration: none;
            color: #888;
            font-weight: bold;
            font-size: 0.85rem;
            transition: 0.3s;
            cursor: pointer;
            display: block;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
        }
        .btn-version:hover { border-color: #cc0000; color: #fff; }
        .btn-version.active {
            background: #1a0505;
            border-color: #cc0000;
            color: #cc0000;
            box-shadow: 0 0 15px rgba(204,0,0,0.2);
        }

        /* زر الحقن Dexter */
        .btn-inject {
            width: 100%;
            background: linear-gradient(180deg, #1a0505, #0a0000);
            color: #cc0000;
            border: 1px solid #cc0000;
            padding: 18px;
            border-radius: 8px;
            font-size: 1.4rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 0 20px rgba(204,0,0,0.1), inset 0 0 20px rgba(204,0,0,0.05);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }
        .btn-inject:hover {
            background: linear-gradient(180deg, #cc0000, #8b0000);
            color: #fff;
            box-shadow: 0 0 40px rgba(204,0,0,0.4);
            transform: scale(1.01);
        }
        .btn-inject:disabled {
            background: #111;
            color: #555;
            border-color: #333;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* تذييل الصفحة */
        .footer {
            margin-top: 25px;
            color: #333;
            font-size: 0.7rem;
            border-top: 1px solid #1a1a1a;
            padding-top: 15px;
            letter-spacing: 3px;
        }
        .footer .quote {
            color: #555;
            font-style: italic;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        @media (max-width: 600px) {
            .title-main { font-size: 1.5rem; }
            .grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .btn-version { font-size: 0.75rem; padding: 12px 5px; }
            .btn-inject { font-size: 1.1rem; padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- رأس الصفحة -->
        <div class="header-line">
            <div class="line"></div>
            <div class="title-main">
                <span class="icon">⚡</span>
                <span>قاعه رياض</span>
            </div>
            <div class="line"></div>
        </div>
        <div class="sub-title">Dexter Morgan Protocol // 4 Seconds</div>

        <!-- صندوق الأوامر -->
        <div class="console-box" id="console">
            <div class="line">[SYSTEM] Tonight's the night.</div>
            <div class="line">[SYSTEM] Select your target version.</div>
        </div>

        <!-- أزرار النسخ -->
        <div class="grid">
            <div class="btn-version" onclick="selectVersion('672', this)">💀 6.72</div>
            <div class="btn-version active" onclick="selectVersion('900', this)">🔰 9.00</div>
            <div class="btn-version" onclick="selectVersion('1100', this)">🔰 11.00</div>
        </div>

        <!-- زر الحقن -->
        <button class="btn-inject" id="injectBtn" onclick="startCountdown()">🚀 INJECT (4s)</button>
        
        <!-- تذييل -->
        <div class="footer">
            <div class="quote">"Dark Passenger is waiting..."</div>
            &copy; 2026 قاعه رياض
        </div>
    </div>

    <script>
        // إعدادات
        let selectedVersion = '900';
        let countdownInterval;

        // دالة اختيار النسخة
        function selectVersion(version, element) {
            selectedVersion = version;
            // تحديث شكل الأزرار
            document.querySelectorAll('.btn-version').forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');
            addLog(`[SYSTEM] Target locked: ${version.toUpperCase()}`);
            document.getElementById('injectBtn').disabled = false;
            document.getElementById('injectBtn').innerText = "🚀 INJECT (4s)";
        }

        // دالة إضافة سجل
        function addLog(msg, type = 'normal') {
            const consoleDiv = document.getElementById('console');
            const line = document.createElement('div');
            line.className = 'line';
            if (type === 'error') line.classList.add('error');
            else if (type === 'success') line.classList.add('success');
            else if (type === 'dark') line.classList.add('dark');
            line.innerText = msg;
            consoleDiv.appendChild(line);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        // دالة العد التنازلي (4 ثوانٍ)
        function startCountdown() {
            const btn = document.getElementById('injectBtn');
            btn.disabled = true;
            
            let counter = 4;
            addLog(`[COUNTDOWN] Initiating 4s protocol... (${counter})`, 'dark');
            btn.innerText = `⏳ EXECUTING (${counter})`;

            countdownInterval = setInterval(() => {
                counter--;
                if (counter > 0) {
                    addLog(`[COUNTDOWN] ${counter}...`, 'dark');
                    btn.innerText = `⏳ EXECUTING (${counter})`;
                } else {
                    clearInterval(countdownInterval);
                    addLog(`[COUNTDOWN] 0. // INJECT NOW.`, 'success');
                    btn.innerText = `⚡ INJECTING...`;
                    performInjection();
                }
            }, 1000);
        }

        // دالة الحقن الفعلية
        function performInjection() {
            const url = `https://kararryad.github.io/hosts/${selectedVersion}.html`;
            addLog(`[SYSTEM] Connecting to payload: ${selectedVersion.toUpperCase()}`);
            
            setTimeout(() => {
                addLog(`[SYSTEM] ✅ PAYLOAD LOADED.`, 'success');
                addLog(`[SYSTEM] Redirecting to Blood Room...`, 'success');
                window.location.href = url;
            }, 2000);
        }
    </script>
</body>
</html>
