<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kararryad</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: #111;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            border: 2px solid #FFD700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
        }

        .hero-name {
            font-size: 4.5rem;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 20px #FFD700, 0 0 40px rgba(255, 215, 0, 0.6);
            margin: 10px 0;
            text-transform: uppercase;
        }

        .phone-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #aaa;
            margin-bottom: 30px;
        }

        .launch-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: #FFD700;
            color: #000;
            font-size: 1.8rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px #FFD700;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .launch-btn:active {
            transform: scale(0.95);
        }

        .transition-screen {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #FFD700;
        }

        .transition-screen h2 {
            font-size: 3rem;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .transition-screen .loader {
            width: 60px; height: 60px;
            border: 6px solid #222;
            border-top: 6px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .hero-name { font-size: 3.5rem; }
            .launch-btn { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="hero-name">kararryad</div>
        <div class="phone-number">07736663121</div>
        <button class="launch-btn" onclick="activateLaunch()">تشغيل النظام</button>
    </div>

    <div id="transition" class="transition-screen">
        <h2>EXECUTING</h2>
        <div class="loader"></div>
        <p style="color:#aaa; margin-top:15px;">جاري تحميل الأداة...</p>
    </div>

    <script>
        function activateLaunch() {
            document.getElementById('transition').style.display = 'flex';
            setTimeout(() => {
                window.open('https://w90008.github.io/6/', '_blank');
                document.getElementById('transition').style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
