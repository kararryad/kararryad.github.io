<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - Night King</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000 url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .top-bar .title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ccc;
        }
        .top-bar .version {
            font-size: 1.3rem;
            color: #4ade80;
            font-weight: bold;
        }
        .main-area {
            padding: 20px 0;
        }
        .status-area {
            font-size: 1.6rem;
            font-weight: bold;
            color: #4ade80;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(74,222,128,0.3);
        }
        .btn-inject {
            background: #cc0000;
            color: #fff;
            border: none;
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(204,0,0,0.3);
            margin-top: 10px;
        }
        .btn-inject:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(204,0,0,0.6);
        }
        .btn-inject:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .footer {
            margin-top: 40px;
            color: #555;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
        }
        .version-select {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }
        .version-select button {
            background: rgba(255,255,255,0.1);
            border: 1px solid #555;
            color: #ccc;
            padding: 8px 25px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .version-select button.active {
            border-color: #4ade80;
            color: #4ade80;
            background: rgba(74,222,128,0.1);
        }
        .version-select button:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="top-bar">
            <div class="title">⚡ قاعه رياض</div>
            <div class="version" id="versionDisplay">6.72 FW</div>
        </div>

        <div class="main-area">
            <div class="version-select">
                <button class="active" onclick="setVersion('672')">6.72</button>
                <button onclick="setVersion('900')">9.00</button>
            </div>

            <div class="status-area" id="statusText">HEN Loaded - After run HEN press Circle button to Exit</div>

            <button class="btn-inject" id="injectBtn" onclick="triggerInject()">
                🚀 Launching Payload
            </button>
        </div>

        <div class="footer">&copy; 2026 قاعه رياض · بغداد</div>
    </div>

    <script>
        let currentVersion = '672';

        function setVersion(ver) {
            currentVersion = ver;
            document.querySelectorAll('.version-select button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('versionDisplay').innerText = ver === '672' ? '6.72 FW' : '9.00 FW';
            document.getElementById('statusText').innerText = ver === '672' 
                ? 'HEN Loaded - After run HEN press Circle button to Exit' 
                : 'GoldHEN Loaded for 9.00 FW';
        }

        function triggerInject() {
            const btn = document.getElementById('injectBtn');
            const status = document.getElementById('statusText');

            btn.disabled = true;
            btn.innerText = "⏳ Launching payload...";
            status.innerText = "⏳ Loading...";

            // محاكاة الحقن
            setTimeout(() => {
                btn.innerText = "✅ HEN Loaded";
                btn.style.background = "#4ade80";
                btn.style.borderColor = "#4ade80";
                btn.style.color = "#000";
                status.innerText = currentVersion === '672' 
                    ? '✅ HEN Loaded - After run HEN press Circle button to Exit' 
                    : '✅ GoldHEN Loaded for 9.00 FW';
                btn.disabled = false;
            }, 2000);
        }
    </script>
</body>
</html>
