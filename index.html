<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kararryad | 3D Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 20%, #0d0d0d, #000000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cairo', sans-serif;
            perspective: 1000px;
            padding: 20px;
        }
        .main-card {
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            max-width: 750px;
            width: 100%;
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 30px 40px rgba(0,0,0,0.8), 0 0 0 2px #FFD700 inset;
            position: relative;
            transform: rotateY(10deg);
            transition: transform 0.5s;
            text-align: center;
        }
        .main-card:hover { transform: rotateY(0deg) scale(1.01); }
        .glow-ring {
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 32px;
            background: conic-gradient(from 0deg, #FFD700, transparent, #FFD700, transparent, #FFD700);
            z-index: -1;
            animation: spin 4s linear infinite;
            filter: blur(5px);
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .profile-section {
            margin-bottom: 30px;
        }
        .profile-section img {
            width: 150px; height: 150px; border-radius: 50%;
            border: 4px solid #FFD700; box-shadow: 0 0 40px #FFD700;
            margin-bottom: 15px;
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .profile-section h1 {
            font-size: 4rem; color: #FFD700; text-shadow: 0 0 20px #FFD700, 0 4px 0 #b8860b;
            font-weight: 900; letter-spacing: 2px; margin: 10px 0;
        }
        .profile-section .phone {
            font-size: 1.5rem; color: #aaa; background: rgba(255,215,0,0.1);
            display: inline-block; padding: 8px 25px; border-radius: 30px;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .launch-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px; padding: 25px; margin-top: 20px;
            box-shadow: 0 0 20px rgba(255,215,0,0.1);
            backdrop-filter: blur(5px);
        }
        .launch-card p {
            color: #ccc; margin-bottom: 15px; font-size: 1.2rem;
        }
        .btn-tool {
            display: inline-block; padding: 18px 60px; background: #FFD700;
            color: #000; font-weight: 900; font-size: 1.8rem; text-decoration: none;
            border-radius: 60px; box-shadow: 0 0 30px #FFD700;
            transition: 0.3s; border: 2px solid #FFD700;
        }
        .btn-tool:active { transform: scale(0.95); }
        .btn-tool:hover { box-shadow: 0 0 50px #FFD700; background: #ffe44d; }

        @media (max-width: 600px) {
            .profile-section h1 { font-size: 3rem; }
            .profile-section img { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="glow-ring"></div>
        <div class="profile-section">
            <img src="https://i.postimg.cc/J0S31W8V/logo.png" alt="شعار">
            <h1>kararryad</h1>
            <div class="phone">07736663121</div>
        </div>

        <div class="launch-card">
            <p>بوابة التشغيل السريع</p>
            <a href="https://ps4-exploit-host.netlify.app/" class="btn-tool" target="_blank">🚀 تشغيل الأداة</a>
        </div>
    </div>
</body>
</html>
