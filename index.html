<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - The Godfather</title>
    <meta http-equiv="Cache-Control" content="max-age=31536000, public, immutable">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            /* صورة فيلم The Godfather الحقيقية كخلفية */
            background: #000 url('https://image.tmdb.org/t/p/original/3bhkrj58Vtu7enYsRolD1fZdja1.jpg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
        }
        /* طبقة سوداء شفافة فوق الصورة لجعل النص واضحاً */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 700px;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
            text-align: center;
        }
        .main-title {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 900;
            color: #d4af37;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .sub-title {
            color: #ccc;
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
            font-family: 'Playfair Display', serif;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
        }
        .btn-3d {
            display: block;
            text-decoration: none;
            padding: 20px 10px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            color: #d4af37;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
            text-align: center;
            font-family: 'Tajawal', sans-serif;
        }
        .btn-3d:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: #d4af37;
            transform: translateY(-3px);
            color: #fff;
        }
        .btn-3d .icon { display: block; font-size: 2.2rem; margin-bottom: 8px; }
        .btn-3d .small { font-size: 0.8rem; color: #aaa; display: block; }
        .footer {
            margin-top: 30px;
            color: #666;
            font-size: 0.8rem;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            padding-top: 20px;
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="main-title">قاعه رياض</div>
        <div class="sub-title">بغداد · قطاع 57</div>

        <div class="grid">
            <a href="https://kararryad.github.io/hosts/672.html" class="btn-3d">
                <span class="icon">💀</span>
                6.72 <span class="small">GoldHEN</span>
            </a>
            <a href="https://kararryad.github.io/hosts/900.html" class="btn-3d">
                <span class="icon">🔰</span>
                9.00 <span class="small">GoldHEN</span>
            </a>
            <a href="https://kararryad.github.io/hosts/1100.html" class="btn-3d">
                <span class="icon">🌐</span>
                11.00 <span class="small">Webkit</span>
            </a>
            <a href="https://kararryad.github.io/files/cheats.zip" class="btn-3d">
                <span class="icon">📦</span>
                الشفرات <span class="small">Cheats</span>
            </a>
        </div>

        <div class="footer">قاعه رياض · مقدمة من بغداد</div>
    </div>
</body>
</html>
