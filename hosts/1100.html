<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - داش بوينت 11.00</title>
    <!-- أكواد الكاتش للحفظ في المتصفح -->
    <meta http-equiv="Cache-Control" content="max-age=31536000, public, immutable">
    <style>
        body {
            background: #0a0a0a;
            background: radial-gradient(circle at 80% 20%, rgba(0, 150, 255, 0.05) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            margin: 0;
        }

        .inject-card {
            width: 100%;
            max-width: 600px;
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .title {
            color: #00aaff;
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 5px;
        }
        .sub-title {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 15px;
        }

        .exploit-container {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 15px;
            padding: 10px;
            min-height: 400px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            min-height: 400px;
            border: none;
            border-radius: 10px;
        }

        .info-note {
            color: #666;
            font-size: 0.8rem;
            margin-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="inject-card">
        <div class="title">⚡ قاعه رياض</div>
        <div class="sub-title">بوابة 11.00 المدمجة (Webkit Exploit)</div>

        <!-- حاوية الاستغلال المدمجة -->
        <div class="exploit-container">
            <iframe 
                src="https://raw.githubusercontent.com/TheoryOfTheGiraffe/GTFO/main/exploit/1100/index.html"
                sandbox="allow-scripts allow-same-origin allow-forms"
                loading="lazy">
            </iframe>
        </div>

        <div class="info-note">
            هذا المحتوى مستضاف من المصدر الأصلي ويعرض داخل بوابتك.
        </div>
    </div>

</body>
</html>
