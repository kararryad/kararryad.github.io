<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
        }
        .logo {
            font-size: 3.5rem;
            font-weight: 900;
            color: #cc0000;
            text-shadow: 0 0 20px rgba(204,0,0,0.4);
        }
        .btn {
            display: block;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background: #cc0000;
            transform: translateY(-3px);
        }
        .btn.gold { border-color: #cc0000; }
        .btn.blue { border-color: #00aaff; }
        .btn.green { border-color: #00ff00; }
        .footer { margin-top: 30px; color: #444; border-top: 1px solid #222; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⚡ قاعه رياض</div>
        <h3 style="color:#777; margin: 10px 0 20px;">اختر نسخة جهازك</h3>

        <a href="https://kararryad.github.io/hosts/672.html" class="btn gold">💀 6.72</a>
        <a href="https://kararryad.github.io/hosts/900.html" class="btn blue">🔰 9.00</a>
        <a href="https://kararryad.github.io/hosts/1100.html" class="btn green">🔰 11.00</a>

        <div class="footer">&copy; 2026 قاعه رياض</div>
    </div>
</body>
</html>
