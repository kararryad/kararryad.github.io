<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - 6.72</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            background-image: radial-gradient(circle at 80% 20%, rgba(0, 150, 255, 0.05) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff);
            background-size: 400% 400%;
            border-radius: 32px;
            z-index: -1;
            animation: borderGlow 5s ease-in-out infinite;
        }
        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .header {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .header .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        .header .location {
            color: #ff00ff;
            font-size: 1.2rem;
            margin-top: 5px;
        }
        .main-area {
            margin: 20px 0;
        }
        .status-area {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00ffff;
            margin: 20px 0;
            min-height: 60px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        .btn-inject {
            background: #cc0000;
            color: #fff;
            border: none;
            padding: 20px 60px;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 30px rgba(204,0,0,0.3);
        }
        .btn-inject:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(204,0,0,0.5);
        }
        .btn-inject:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }
        .footer {
            margin-top: 40px;
            color: #555;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">⚡ قاعه رياض</div>
            <div class="location">مدينة الصدر · قطاع 57</div>
        </div>
        <div class="main-area">
            <div class="status-area" id="statusText">🔴 جاهز للتشغيل</div>
            <button class="btn-inject" id="injectBtn" onclick="startInjection()">
                🚀 تشغيل الحقن
            </button>
        </div>
        <div class="footer">&copy; 2026 قاعه رياض · بغداد</div>
    </div>

    <script>
        // سكربت الكاتش المباشر (يحاكي طريقة gamerhack)
        function startInjection() {
            const btn = document.getElementById('injectBtn');
            const status = document.getElementById('statusText');

            btn.disabled = true;
            btn.innerText = "⏳ جاري التحميل...";
            status.innerText = "⏳ Installing Offline Cache...";

            // محاكاة تثبيت الكاتش (يظهر للمستخدم فقط)
            setTimeout(() => {
                status.innerText = "✅ Cache Installed Successfully ✅";
                btn.innerText = "⏳ Loading GoldHEN...";
                
                setTimeout(() => {
                    status.innerText = "✅ GoldHEN Loaded Successfully ✅";
                    btn.innerText = "✅ تم التشغيل";
                    btn.style.background = "#4ade80";
                    btn.style.color = "#000";
                }, 2000);
            }, 3000);
        }
    </script>
</body>
</html>
