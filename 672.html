<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - 6.72</title>
    <!-- كاتش PS4 -->
    <meta http-equiv="Cache-Control" content="max-age=31536000, public, immutable">
    <meta http-equiv="Pragma" content="cache">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505;
            /* خلفية متحركة بنيون */
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(0, 255, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(255, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.8) 0%, #050505 100%);
            background-size: 200% 200%;
            animation: cyberBg 10s ease-in-out infinite alternate;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
        }
        @keyframes cyberBg {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* حاوية زجاجية متحركة */
        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 25px;
            padding: 40px 30px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.1), inset 0 0 40px rgba(0, 255, 255, 0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        /* حافة نيون متحركة */
        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: conic-gradient(from 0deg, #00ffff, #ff00ff, #00ffff, #ff00ff, #00ffff);
            border-radius: 27px;
            z-index: -1;
            animation: spinNeon 4s linear infinite;
        }
        @keyframes spinNeon {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* الشريط العلوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .top-bar .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: #00ffff;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }
        .top-bar .version { font-size: 1.2rem; color: #ff00ff; font-weight: bold; text-shadow: 0 0 15px rgba(255,0,255,0.3); }

        /* شريط الحالة */
        .status-area {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00ffff;
            margin: 20px 0;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            min-height: 40px;
        }

        /* زر القفل المتحرك */
        .lock-area { margin: 20px 0; }
        .lock-icon {
            display: inline-block;
            font-size: 4.5rem;
            cursor: pointer;
            transition: 0.3s;
            padding: 15px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
        }
        .lock-icon:hover { transform: scale(1.1) rotate(10deg); border-color: #00ffff; }
        .lock-icon.locked { color: #ff4444; border-color: #ff4444; }
        .lock-icon.unlocked { color: #00ffff; border-color: #00ffff; box-shadow: 0 0 50px rgba(0, 255, 255, 0.5); }

        /* شريط التحميل النيون */
        .loader-container {
            display: none;
            width: 80%;
            max-width: 400px;
            height: 6px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 10px;
            margin: 15px auto 0;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }
        .loader-container .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 10px;
            transition: width 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .footer { margin-top: 30px; color: #555; font-size: 0.8rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="title">⚡ قاعه رياض</div>
            <div class="version">6.72 FW</div>
        </div>
        <div class="status-area" id="statusText">🔴 انتظر الحقن...</div>
        
        <div class="lock-area">
            <div class="lock-icon locked" id="lockBtn" onclick="startInjection()">🔒</div>
            <div class="loader-container" id="loader"><div class="fill" id="progressFill"></div></div>
        </div>
        
        <div class="footer">&copy; 2026 قاعه رياض · بغداد</div>
    </div>

    <script>
        function startInjection() {
            const lock = document.getElementById('lockBtn');
            const loader = document.getElementById('loader');
            const fill = document.getElementById('progressFill');
            const status = document.getElementById('statusText');

            if (lock.classList.contains('unlocked')) return;

            lock.style.pointerEvents = 'none';
            loader.style.display = 'block';
            status.innerText = "⏳ جاري التهيئة...";

            let counter = 4;
            const countInterval = setInterval(() => {
                status.innerText = `⏳ ${counter}`;
                counter--;
                if (counter < 0) {
                    clearInterval(countInterval);
                    status.innerText = "🚀 جاري الحقن...";
                    
                    let progress = 0;
                    const loadInterval = setInterval(() => {
                        progress += 10;
                        fill.style.width = progress + '%';
                        if (progress >= 100) {
                            clearInterval(loadInterval);
                            setTimeout(() => {
                                lock.classList.remove('locked');
                                lock.classList.add('unlocked');
                                lock.innerText = '🔓';
                                lock.style.pointerEvents = 'none';
                                loader.style.display = 'none';
                                status.innerText = "✅ HEN Loaded Successfully!";
                            }, 500);
                        }
                    }, 150);
                }
            }, 1000);
        }
    </script>
</body>
</html>
