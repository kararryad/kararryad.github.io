<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>kararryad | System Initialize</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cairo', sans-serif;
            padding: 20px;
        }

        /* شاشة سينمائية */
        .cinema-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 20%, #111, #000 80%);
            z-index: -1;
        }

        .main-card {
            background: linear-gradient(145deg, rgba(20,20,20,0.95), rgba(5,5,5,0.95));
            padding: 40px; border-radius: 30px;
            width: 100%; max-width: 600px;
            box-shadow: 0 0 0 2px #FFD700 inset, 0 0 60px rgba(255,215,0,0.2);
            text-align: center; position: relative;
            transform: rotateY(5deg);
        }

        .movie-title {
            font-family: 'Orbitron', sans-serif; color: #FFD700;
            font-size: 2rem; letter-spacing: 5px; text-shadow: 0 0 20px #FFD700;
            margin-bottom: 20px;
            animation: glitch 4s infinite;
        }
        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-2px, 2px); }
            94% { transform: translate(2px, -2px); }
            96% { transform: translate(-1px, 1px); }
        }

        .logo {
            width: 140px; height: 140px; border-radius: 50%;
            border: 3px solid #FFD700; box-shadow: 0 0 40px #FFD700;
            margin-bottom: 15px;
        }

        .hero-name {
            font-size: 4rem; font-weight: 900; color: #FFD700;
            text-shadow: 0 0 30px #FFD700, 0 4px 0 #b8860b;
            margin: 5px 0;
        }

        .code-phone {
            font-family: 'Orbitron', sans-serif; color: #aaa; font-size: 1.2rem;
            background: rgba(255,215,0,0.1); padding: 5px 15px; border-radius: 5px;
            display: inline-block; margin-bottom: 30px; border: 1px solid #333;
        }

        /* زر التشغيل السينمائي */
        .launch-btn {
            background: linear-gradient(135deg, #FFD700, #b8860b);
            color: #000; border: none; padding: 18px 50px;
            font-size: 1.8rem; font-weight: 900; border-radius: 60px;
            cursor: pointer; box-shadow: 0 0 30px #FFD700;
            width: 100%; font-family: 'Orbitron', sans-serif;
        }

        .launch-btn:active { transform: scale(0.95); }

        /* شاشة التحميل (تظهر بدلاً من زر التشغيل) */
        #loading-screen {
            display: none; text-align: center; color: #00ffcc;
            font-family: 'Orbitron', sans-serif; margin-top: 20px;
        }
        .loading-text {
            font-size: 1.5rem; color: #00ffcc;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="cinema-bg"></div>

    <div class="main-card">
        <div class="movie-title">// SYSTEM INITIALIZING //</div>
        <img src="https://i.postimg.cc/J0S31W8V/logo.png" class="logo" alt="شعار">
        <div class="hero-name">kararryad</div>
        <div class="code-phone">[ 07736663121 ]</div>

        <!-- زر التشغيل الأساسي -->
        <button class="launch-btn" id="mainBtn" onclick="startLoading()">▶ تشغيل النظام</button>

        <!-- شاشة التحميل المخفية -->
        <div id="loading-screen">
            <div class="loading-text">جاري التحميل...</div>
            <p style="color:#888; font-size:0.9rem; margin-top:10px;">محاولة الاتصال بالخادم...</p>
        </div>
    </div>

    <script>
        function startLoading() {
            // إخفاء الزر وإظهار شاشة التحميل
            document.getElementById('mainBtn').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'block';

            // بعد 3 ثوانٍ، فتح الأداة في نافذة جديدة
            setTimeout(() => {
                window.open('https://w90008.github.io/6/', '_blank');
            }, 3000);
        }
    </script>
</body>
</html>
