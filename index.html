<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header {
            width: 100%;
            background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 100%);
            padding: 40px 0 20px 0;
            text-align: center;
            border-bottom: 2px solid #cc0000;
        }

        .header h1 {
            font-size: 3rem;
            color: #cc0000;
            margin: 0;
            text-shadow: 0 0 15px rgba(204, 0, 0, 0.5);
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1.5rem;
            color: #dddddd;
            margin: 10px 0 0 0;
        }

        .number-box {
            background-color: #222;
            padding: 10px 25px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 15px;
            border: 1px solid #cc0000;
            font-weight: bold;
            color: #cc0000;
            font-size: 1.2rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1000px;
            width: 90%;
            margin: 50px auto;
        }

        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 30px 20px;
            text-decoration: none;
            color: #ffffff;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 120px;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            background-color: #cc0000;
            border-color: #cc0000;
            box-shadow: 0 10px 25px rgba(204, 0, 0, 0.4);
        }

        .card h2 {
            margin: 0 0 10px 0;
            font-size: 1.6rem;
        }

        .card p {
            margin: 0;
            font-size: 1rem;
            color: #aaaaaa;
        }

        .card:hover p {
            color: #ffffff;
        }

        .footer {
            width: 100%;
            margin-top: 30px;
            padding: 20px 0;
            text-align: center;
            background-color: #111;
            color: #555;
            border-top: 1px solid #222;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>قاعه رياض</h1>
        <p>مرحباً بكم في بوابتي</p>
        <div class="number-box">📞 07736663121</div>
    </div>

    <div class="grid-container">
        <!-- زر الاتصال المباشر -->
        <a href="tel:07736663121" class="card">
            <h2>📞 اتصل بي</h2>
            <p>اضغط للاتصال المباشر</p>
        </a>

        <!-- رابط واتساب -->
        <a href="https://wa.me/9647736663121" class="card" target="_blank">
            <h2>💬 واتساب</h2>
            <p>راسلني عبر واتساب</p>
        </a>

        <!-- مساحة لأدواتك أو روابطك -->
        <a href="#" class="card">
            <h2>⚙️ أدواتي</h2>
            <p>مجموعة الأدوات الخاصة</p>
        </a>

        <!-- رابط تيليجرام -->
        <a href="https://t.me/YourUsername" class="card" target="_blank">
            <h2>✈️ تيليجرام</h2>
            <p>انضم لقناتي</p>
        </a>
    </div>

    <div class="footer">
        &copy; 2026 قاعه رياض. جميع الحقوق محفوظة.
    </div>

</body>
</html>
