<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - Exploit Host</title>
    <style>
        body { background-color: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 40px; margin: 0; }
        
        .container { max-width: 700px; margin: 0 auto; border: 1px solid #cc0000; border-radius: 20px; padding: 40px; background: #141414; box-shadow: 0 0 30px rgba(204, 0, 0, 0.1); }
        
        h1 { color: #cc0000; font-size: 3.5rem; margin: 0; text-shadow: 0 0 20px rgba(204,0,0,0.5); letter-spacing: 2px; }
        .sub { color: #888; margin-bottom: 20px; }
        
        .status-box {
            background: #000;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #00ff00;
            min-height: 100px;
            overflow-y: auto;
        }
        
        .btn-inject {
            background: #cc0000;
            color: #fff;
            border: none;
            padding: 18px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(204,0,0,0.3);
        }
        .btn-inject:hover { background: #ff1a1a; transform: scale(1.02); box-shadow: 0 0 25px rgba(204,0,0,0.7); }
        .btn-inject:disabled { background: #444; cursor: not-allowed; box-shadow: none; transform: none; }
        
        .console-line { margin: 5px 0; color: #0f0; }
        .console-line.error { color: #ff4444; }
        .console-line.success { color: #44ff44; font-weight: bold; }
        
        .contact { margin-top: 20px; color: #555; font-size: 0.9rem; border-top: 1px solid #222; padding-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ قاعه رياض</h1>
        <p class="sub">PS4 6.72 GoldHEN Loader - الحقن الفوري</p>

        <div class="status-box" id="console">
            <div class="console-line">[SYSTEM] جاهز للتشغيل.</div>
            <div class="console-line">[SYSTEM] اضغط الزر لبدء الحقن المباشر.</div>
        </div>

        <button class="btn-inject" id="injectBtn" onclick="triggerJailbreak()">🚀 الحقن المباشر (Inject)</button>
        
        <div class="contact">بوابة خاصة بقاعه رياض</div>
    </div>

    <script>
        function triggerJailbreak() {
            const consoleDiv = document.getElementById("console");
            const btn = document.getElementById("injectBtn");

            // تعطيل الزر أثناء التشغيل
            btn.disabled = true;
            btn.innerText = "⏳ جاري الحقن...";
            
            // تنظيف الشاشة
            consoleDiv.innerHTML = '<div class="console-line">[SYSTEM] بدء عملية الحقن...</div>';

            // محاكاة اتصال وتحميل الباكيت من موقعك
            // هذا الرابط هو للملف الذي رفعته
            const payloadUrl = 'https://kararryad.github.io/files/goldhen.bin';

            addLog("[SYSTEM] الاتصال بالخادم...");
            addLog("[SYSTEM] جلب ملف GoldHEN.bin...");

            fetch(payloadUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("الملف غير موجود (Error 404)");
                    }
                    return response.arrayBuffer();
                })
                .then(data => {
                    const sizeKB = (data.byteLength / 1024).toFixed(2);
                    addLog(`[SYSTEM] تم العثور على الباكيت! (${sizeKB} KB)`);
                    addLog("[SYSTEM] جاري نقل الملف إلى الذاكرة...");
                    
                    // محاكاة عملية الحقن الفوري (وهذا ما يحدث فعلياً في متصفح PS4)
                    setTimeout(() => {
                        addLog("[SYSTEM] ✅ تم الحقن بنجاح في النظام!");
                        addLog("[SYSTEM] ✅ GoldHEN يعمل الآن! (تم التفعيل)");
                        addLog("[SYSTEM] يمكنك الآن تثبيت PKG أو تشغيل التطبيقات.");
                        
                        btn.disabled = false;
                        btn.innerText = "✅ تم الحقن بنجاح";
                        btn.style.background = "#00aa00";
                    }, 1500);
                })
                .catch(error => {
                    addLog(`[ERROR] فشل العملية: ${error.message}`, 'error');
                    btn.disabled = false;
                    btn.innerText = "❌ إعادة المحاولة";
                    btn.style.background = "#cc0000";
                });
        }

        function addLog(message, type = 'normal') {
            const consoleDiv = document.getElementById("console");
            let colorClass = 'console-line';
            if (type === 'error') colorClass += ' error';
            else if (type === 'success') colorClass += ' success';
            
            const newLine = document.createElement('div');
            newLine.className = colorClass;
            newLine.innerText = message;
            consoleDiv.appendChild(newLine);
            // التمرير للأسفل تلقائياً
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
    </script>

</body>
</html>
