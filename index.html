<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - NIGHT KING 6.72 FW</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000 url('https://image.tmdb.org/t/p/original/3gW1bE5d9Q0bC1d2e3f4g5h6.jpg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 1.8rem;
            color: #cc0000;
            text-shadow: 0 0 20px rgba(204,0,0,0.3);
        }
        .status {
            color: #4ade80;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(74,222,128,0.3);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
        }
        .card {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            text-decoration: none;
            color: #ccc;
            transition: 0.3s;
        }
        .card:hover {
            border-color: #cc0000;
            background: rgba(204,0,0,0.1);
            transform: translateY(-3px);
        }
        .card .icon { font-size: 2rem; display: block; margin-bottom: 8px; }
        .card .label { font-size: 0.8rem; font-weight: bold; }
        .footer {
            margin-top: 30px;
            color: #555;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
            text-align: center;
        }
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </style>
</head>

            <a href="#" class="card"><span class="icon">📂</span><span class="label">Bin Loader</span></a>
            <a href="#" class="card"><span class="icon">🌐</span><span class="label">WebRTE</span></a>
            <a href="#" class="card"><span class="icon">🎮</span><span class="label">GTA V Mod</span></a>

            <a href="#" class="card"><span class="icon">⭐</span><span class="label">ToDex</span></a>
        </div>

        <div class="footer">&copy; 2026 قاعه رياض · بغداد</div>

</body>
</html>
