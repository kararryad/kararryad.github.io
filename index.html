<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - لوحة التحكم</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        /* إعدادات عامة */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            background-image: url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        /* طبقة داكنة فوق الخلفية لجعل الأزرار واضحة */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            text-align: center;
        }

        /* شريط العنوان */
        .header {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(5px);
            flex-wrap: wrap;
        }
        .header h1 {
            color: #cc0000;
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .header .links a {
            color: #aaa;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .header .links a:hover { color: #fff; }

        /* شبكة الأيقونات */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
        }
        .card {
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px 10px;
            text-align: center;
            text-decoration: none;
            color: #ccc;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
        }
        .card:hover {
            background: rgba(204, 0, 0, 0.2);
            border-color: #cc0000;
            transform: translateY(-5px) scale(1.02);
            color: #fff;
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.2);
        }
        .card .icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
            display: block;
        }
        .card .label {
            font-size: 0.85rem;
            font-weight: bold;
            line-height: 1.2;
        }
        .card .sub {
            font-size: 0.65rem;
            color: #666;
            margin-top: 3px;
        }

        /* التذييل */
        .footer {
            margin-top: 30px;
            color: #555;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
        }

        /* دعم الكاتش */
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">

            <h1>⚡ قاعه رياض</h1>

                <a href="#">حول</a>

        <!-- شبكة الأيقونات -->

            <a href="https://kararryad.github.io/hosts/900.html" class="card">

        </div>

        <div class="footer">&copy; 2026 قاعه رياض · بغداد</div>
    </div>

    <script>
        // تفعيل الكاتش
        if ('serviceWorker' in navigator) {

        }

</body>
</html>
