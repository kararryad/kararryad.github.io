<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #000;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }
        .logo img { width: 80%; }
        .subtitle { color: #064e3b; font-size: 1.2rem; margin-bottom: 20px; }
        
        .console-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 20px;
            text-align: left;
            color: #fff;
            font-family: monospace;
            margin-bottom: 20px;
            min-height: 100px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 15px 5px;
            border-radius: 15px;
            color: #064e3b;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }
        .btn:hover { transform: scale(1.05); background: rgba(255,255,255,0.4); }
        .btn.active { background: rgba(255,255,255,0.5); box-shadow: 0 0 20px rgba(255,255,255,0.2); }

        .btn-inject {
            width: 100%;
            padding: 20px;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            background: linear-gradient(135deg, #ff0080, #ff8c00);
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(255,0,128,0.3);
        }
        .btn-inject:hover { transform: scale(1.02); }
        
        .footer { color: #064e3b; font-size: 0.8rem; margin-top: 20px; }
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <img src="https://kararryad.github.io/files/assets/logo.png" alt="Logo">
        </div>
        <div class="subtitle">بغداد · قطاع 57</div>

        <div class="console-box" id="console">
            <div>[SYSTEM] واجهة عالية الجودة.</div>
            <div>[SYSTEM] اختر النسخة للمتابعة.</div>
        </div>

        <div class="grid">
            <a href="https://kararryad.github.io/hosts/672.html" class="btn">💀 6.72</a>
            <a href="https://kararryad.github.io/hosts/900.html" class="btn active">🔰 9.00</a>
            <a href="https://kararryad.github.io/hosts/1100.html" class="btn">🌐 11.00</a>
        </div>

        <button class="btn-inject" onclick="window.location.href='https://kararryad.github.io/hosts/900.html'">🚀 تشغيل الحقن</button>

        <div class="footer">📍 بغداد - قطاع 57 &copy; 2026</div>
    </div>

</body>
</html>
