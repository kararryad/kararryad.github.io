<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kararryad | Hacker Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            padding: 20px;
            overflow: hidden;
            color: #00ff00;
        }

        /* خلفية الأكواد المتناثرة */
        .hacker-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.1;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><text x="10" y="20" fill="%2300ff00" font-size="10">01001010</text><text x="50" y="40" fill="%2300ff00" font-size="12">11010001</text><text x="20" y="70" fill="%2300ff00" font-size="8">00101110</text><text x="70" y="80" fill="%2300ff00" font-size="14">10110011</text><text x="40" y="95" fill="%2300ff00" font-size="11">01101001</text></svg>');
            animation: scrollBg 20s linear infinite;
        }

        @keyframes scrollBg {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100px); }
        }

        .card {
            background: rgba(0, 0, 0, 0.9);
            padding: 40px 30px;
            border-radius: 0;
            width: 100%;
            max-width: 700px;
            border: 2px solid #00ff00;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2), inset 0 0 30px rgba(0, 255, 0, 0.1);
            text-align: center;
            position: relative;
        }

        /* تأثير الـ CRT (خطوط أفقية) */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 0, 0.03) 2px, rgba(0, 255, 0, 0.03) 4px);
            pointer-events: none;
            z-index: 10;
        }

        .status-bar {
            color: #888;
            text-align: left;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .status-bar span {
            color: #00ff00;
        }

        .hero-name {
            font-size: 5rem;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00, 0 0 40px rgba(0, 255, 0, 0.5);
            margin: 20px 0;
            letter-spacing: 5px;
            animation: glitch 0.5s infinite;
        }

        @keyframes glitch {
            0% { text-shadow: 0 0 20px #00ff00, 0 0 40px rgba(0, 255, 0, 0.5); }
            50% { text-shadow: 2px 0 #00ff00, -2px 0 #ff0000, 0 0 20px #00ff00; }
            100% { text-shadow: 0 0 20px #00ff00, 0 0 40px rgba(0, 255, 0, 0.5); }
        }

        .phone-number {
            font-size: 2rem;
            color: #888;
            margin-bottom: 40px;
            border: 1px solid #333;
            padding: 10px 20px;
            display: inline-block;
        }

        .launch-btn {
            background: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 15px;
            width: 100%;
            font-size: 1.8rem;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        .launch-btn:active {
            background: #00ff00;
            color: #000;
            transform: scale(0.95);
        }

        /* شاشة التحميل (الهاكرز) */
        .transition-screen {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border: 2px solid #00ff00;
        }

        .transition-screen h2 {
            font-size: 3rem;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        @media (max-width: 600px) {
            .hero-name { font-size: 3.5rem; }
            .phone-number { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="hacker-bg"></div>

    <div class="card">
        <div class="status-bar">
            <span>C:\</span>Users\kararryad &gt; <span>System Ready</span>
        </div>

        <div class="hero-name">kararryad</div>
        <div class="phone-number">07736663121</div>

        <button class="launch-btn" onclick="activateLaunch()">[ Execute System ]</button>
    </div>

    <div id="transition" class="transition-screen">
        <h2>◼ ACCESS GRANTED</h2>
        <p style="color:#888; margin-top:20px;">Initializing... Loading Payload...</p>
    </div>

    <script>
        function activateLaunch() {
            document.getElementById('transition').style.display = 'flex';
            setTimeout(() => {
                window.open('https://w90008.github.io/6/', '_blank');
                document.getElementById('transition').style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
