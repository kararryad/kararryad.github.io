<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - 9.00</title>
    <link rel="manifest" href="/manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered'))
            .catch(err => console.log('Service Worker not registered', err));
    }
</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000 url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .top-bar .title { font-size: 1.5rem; font-weight: bold; color: #ccc; }
        .top-bar .version { font-size: 1.3rem; color: #4ade80; font-weight: bold; }
        .status-area {
            font-size: 1.6rem;
            font-weight: bold;
            color: #4ade80;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(74,222,128,0.3);
        }
        .btn-inject {
            background: #cc0000;
            color: #fff;
            border: none;
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(204,0,0,0.3);
        }
        .btn-inject:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(204,0,0,0.6);
        }
        .btn-inject:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .footer {
            margin-top: 40px;
            color: #555;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="top-bar">
            <div class="title">⚡ قاعه رياض</div>
            <div class="version">9.00 FW</div>
        </div>
        <div class="status-area">GoldHEN Loaded for 9.00 FW</div>
        <button class="btn-inject" id="injectBtn" onclick="triggerInject()">🚀 Launching Payload</button>
        <div class="footer">&copy; 2026 قاعه رياض · بغداد</div>
    </div>
    <script>
        function triggerInject() {
            const btn = document.getElementById('injectBtn');
            btn.disabled = true;
            btn.innerText = "⏳ Launching payload...";
            setTimeout(() => {
                btn.innerText = "✅ GoldHEN Loaded";
                btn.style.background = "#4ade80";
                btn.style.color = "#000";
                btn.disabled = false;
            }, 2000);
        }
    </script>
</body>
</html>
