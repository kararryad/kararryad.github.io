<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعه رياض - أساطير كرة القدم</title>
    <meta http-equiv="Cache-Control" content="max-age=31536000, public, immutable">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            /* خلفية داكنة مع دخان */
            background: #0a0000;
            background-image: radial-gradient(circle at 20% 20%, rgba(139, 0, 0, 0.3) 0%, transparent 50%),
                              radial-gradient(circle at 80% 80%, rgba(0, 0, 0, 0.9) 0%, #000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        /* تأثير الدخان المتحرك */
        .smoke-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media.giphy.com/media/3o7bu3X5J3t5J3t5J3/giphy.gif') center center;
            background-size: cover;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        /* حاوية التصميم الرئيسية */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 800px;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(204, 0, 0, 0.4);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 0 60px rgba(204, 0, 0, 0.1);
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(204, 0, 0, 0.3);
            padding-bottom: 20px;
        }
        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            color: #cc0000;
            text-shadow: 0 0 30px rgba(204, 0, 0, 0.6);
            letter-spacing: 3px;
        }
        .sub-title {
            color: #aaa;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-top: 5px;
        }
        .location {
            color: #ff4444;
            font-size: 0.9rem;
            margin-top: 5px;
            font-weight: bold;
        }

        /* صراع الأساطير (ميسي ورونالدو) */
        .legends {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            border: 1px solid rgba(204, 0, 0, 0.2);
        }
        .legend-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #cc0000;
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.3);
        }
        .vs-text {
            color: #ff4444;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
        }

        /* البطاقات الأنيقة */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .btn-card {
            display: block;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(204, 0, 0, 0.4);
            border-radius: 16px;
            padding: 20px 10px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #cc0000;
            text-align: center;
            font-family: 'Tajawal', sans-serif;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(204, 0, 0, 0.05);
        }
        .btn-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #ff0000;
            box-shadow: 0 0 30px rgba(204, 0, 0, 0.3), inset 0 0 30px rgba(204, 0, 0, 0.1);
            color: #fff;
            background: rgba(204, 0, 0, 0.1);
        }
        .btn-card .icon {
            display: block;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .btn-card .title {
            font-weight: bold;
            font-size: 1.2rem;
        }
        .btn-card .desc {
            font-size: 0.8rem;
            color: #666;
        }
        .btn-card:hover .desc { color: #aaa; }

        .footer {
            margin-top: 30px;
            color: #444;
            font-size: 0.8rem;
            border-top: 1px solid rgba(204, 0, 0, 0.2);
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="smoke-bg"></div>
    <div class="container">
        <div class="header">
            <div class="main-title">⚡ قاعه رياض</div>
            <div class="sub-title">بغداد · المدينة · قطاع 57</div>
            <div class="location">🚀 صالة الأساطير</div>
        </div>

        <!-- قسم ميسي ورونالدو -->
        <div class="legends">
            <img class="legend-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Lionel_Messi_20180626.jpg/640px-Lionel_Messi_20180626.jpg" alt="ميسي">
            <div class="vs-text">⚔️</div>
            <img class="legend-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Cristiano_Ronaldo_2018.jpg/640px-Cristiano_Ronaldo_2018.jpg" alt="رونالدو">
        </div>

        <div class="grid">
            <a href="https://kararryad.github.io/hosts/672.html" class="btn-card">
                <span class="icon">💀</span>
                <span class="title">6.72</span>
                <span class="desc">GoldHEN</span>
            </a>
            <a href="https://kararryad.github.io/hosts/900.html" class="btn-card">
                <span class="icon">🔰</span>
                <span class="title">9.00</span>
                <span class="desc">GoldHEN v2.4</span>
            </a>
            <a href="https://kararryad.github.io/hosts/1100.html" class="btn-card">
                <span class="icon">🌐</span>
                <span class="title">11.00</span>
                <span class="desc">Webkit</span>
            </a>
            <a href="https://kararryad.github.io/files/cheats.zip" class="btn-card">
                <span class="icon">📦</span>
                <span class="title">الشفرات</span>
                <span class="desc">Cheats</span>
            </a>
        </div>

        <div class="footer">قاعه رياض · مقدمة من بغداد</div>
    </div>
</body>
</html>
